name: compose-preview-analytics

services:
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    init: true
    restart: unless-stopped
    ports:
      # Dashboard is available over SSH only. Caddy exposes just collection routes.
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: "postgresql://umami:${UMAMI_DB_PASSWORD:?Run setup.sh first}@umami-db:5432/umami"
      APP_SECRET: "${UMAMI_APP_SECRET:?Run setup.sh first}"
      TWO_FACTOR_ENCRYPTION_KEY: "${UMAMI_TWO_FACTOR_KEY:?Run setup.sh first}"
      DISABLE_TELEMETRY: "1"
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - default
      - preview
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  umami-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: "${UMAMI_DB_PASSWORD:?Run setup.sh first}"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

networks:
  preview:
    external: true
    name: "${PREVIEW_NETWORK:-compose-preview_default}"
volumes:
  database:
