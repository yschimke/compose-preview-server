# OPT-IN overlay: serve a DEPLOYMENT's config from version control instead of the volume.
#
# The base docker-compose.yml keeps catalogs.json, producers.json and settings.json on the `preview_config` named
# volume, seeded on first boot and never overwritten after, so an image roll can't stomp a runtime
# edit. The cost of that is that config the host has never seen cannot arrive by `git pull`, only
# through the admin API, which is additive: anything it cannot express (a deletion, a changed
# catalog `repo`) diverges silently until someone edits the volume by hand.
#
# This overlay makes the committed files the source of truth: the host's config is whatever your
# deployment directory says it is, and deploying config is `git pull && docker compose up -d`.
#
#   docker compose -f docker-compose.yml -f docker-compose.deploy-config.yml up -d
#
# or, so every later `docker compose` in this directory picks it up without the flags, put this in
# .env (it is read by compose itself, not passed to a container):
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.deploy-config.yml
#
# Read-only is deliberate, and it does NOT break the admin API. ServeCatalogAdmin.persist() fails
# soft: POST /admin/catalogs still registers and serves the catalog, and only the persistence step
# reports back `"warning": "not persisted: …"`. What you give up is a runtime edit outliving a
# restart, which is the whole point: it would be config drift from version control.
#
# BEFORE ADOPTING THIS ON A HOST THAT HAS BEEN RUNNING, diff the two. The volume file is a superset
# whenever anyone added a catalog or a trusted producer directly on the host, and this overlay
# swaps it out wholesale — anything on the host and not in git silently stops being served at the
# next restart:
#
#   curl -sH "X-Compose-Preview-Admin-Token: $SERVE_ADMIN_TOKEN" https://<host>/admin/catalogs
#   docker compose exec preview cat /config/catalogs.json
#
# DEPLOY_CONFIG_DIR names the deployment directory holding those three files, relative to this file
# or absolute. It defaults to deploy/example, the generic starting point; point it at your own
# directory (a copy of deploy/example, or a checkout of your private deployment repository).
services:
  preview:
    volumes:
      # Mounted as individual FILES over the `preview_config` volume, not as a directory over
      # /config: the volume also carries runtime state the app writes there, and a directory mount
      # would hide it. Docker orders mounts by path depth, so /config lands first and these nest
      # inside it.
      - ${DEPLOY_CONFIG_DIR:-../example}/catalogs.json:/config/catalogs.json:ro
      - ${DEPLOY_CONFIG_DIR:-../example}/producers.json:/config/producers.json:ro
      # The entrypoint reads its non-secret settings from /config/settings.json (SERVE_SETTINGS_FILE),
      # so the deployment's settings.json rides along: OAuth client/callback, UI-builder policy.
      - ${DEPLOY_CONFIG_DIR:-../example}/settings.json:/config/settings.json:ro
