<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compose Preview</title>
<style>
  :root { color-scheme: light dark; font: 14px system-ui, sans-serif; color: var(--color-text-primary, #1b1b1f); background: var(--color-background-primary, #fff); }
  body { margin: 0; }
  .app { padding: 12px; }
  .bar { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .title { font-weight: 650; }
  .muted { color: var(--color-text-secondary, #666); font-size: 12px; }
  .canvas { min-height: 120px; border: 1px solid var(--color-border, #d8d8dd); border-radius: 10px; background: var(--color-background-secondary, #f8f8fa); display: grid; place-items: center; overflow: auto; }
  .canvas img { max-width: 100%; max-height: 560px; object-fit: contain; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; width: 100%; padding: 8px; box-sizing: border-box; }
  .cell { border: 1px solid var(--color-border, #d8d8dd); border-radius: 8px; padding: 6px; background: var(--color-background-primary, #fff); cursor: pointer; }
  .cell img { width: 100%; display: block; }
  .cell code { font-size: 11px; overflow-wrap: anywhere; }
  .fallback { width: 100%; padding: 12px; box-sizing: border-box; }
  .fallback p { margin: 0 0 8px; }
  .fallback pre { margin: 0; padding: 10px; border-radius: 7px; background: var(--color-background-primary, #fff); white-space: pre-wrap; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  button { font: inherit; padding: 6px 9px; border-radius: 6px; border: 1px solid var(--color-border, #aaa); background: var(--color-background-primary, #fff); color: inherit; cursor: pointer; }
</style>
<body>
<main class="app">
  <div class="bar">
    <div>
      <div class="title">Compose Preview</div>
      <div id="meta" class="muted">Waiting for a preview result…</div>
    </div>
  </div>
  <section id="canvas" class="canvas">
    <div class="empty">This viewer displays render and matrix results when the host supplies them.</div>
  </section>
  <div class="actions">
    <button id="refresh" hidden>Refresh resource</button>
    <button id="a11y" hidden>Show accessibility overlay</button>
    <button id="use" hidden>Use selected result</button>
  </div>
</main>
<script>
(() => {
  const q = selector => document.querySelector(selector);
  const canvas = q('#canvas');
  const meta = q('#meta');
  const refresh = q('#refresh');
  const a11y = q('#a11y');
  const use = q('#use');
  const REQUEST_TIMEOUT_MS = 5000;
  const RESOURCE_READ_TIMEOUT_MS = 65000;
  const RESOURCE_POLL_INTERVAL_MS = 5000;
  // Static host contract (for example Antigravity's <agent-embed>):
  // #compose-preview-result=<unpadded base64url UTF-8 JSON>
  // JSON shape: {"version":1,"arguments":{...},"result":<MCP CallToolResult>}
  // The hash is intentionally credential-free and bounded so the same file is safe to package.
  const STATIC_RESULT_PARAM = 'compose-preview-result';
  const MAX_STATIC_RESULT_BYTES = 500000;
  const CREDENTIAL_KEY = /(token|authorization|password|secret|api[-_]?key|cookie|session)/i;
  const pending = new Map();
  const lateResponses = new Map();
  let nextId = 1;
  let initialized = false;
  let hasToolResult = false;
  let staticMode = false;
  let selected;
  let toolArguments = {};
  let resourceToken;
  let resourceResult;
  let resourceReadGeneration = 0;
  let resourceReadUri;
  let resourcePollTimer;
  let resourceSubscriptionGeneration = 0;
  let subscribedResourceUri;
  let resourceSubscriptionTargetUri;
  let resourceSubscriptionQueue = Promise.resolve();
  let hostResourceSubscriptions = false;
  let hostServerTools = false;
  let baseImageData;
  let overlayImageData;
  let overlayVisible = false;
  let overlayGeneration = 0;
  let overlayCall;
  let baseMetaText = '';

  function request(method, params, timeoutMs = REQUEST_TIMEOUT_MS, onLateResult) {
    const id = nextId++;
    return new Promise((resolve, reject) => {
      const timer = window.setTimeout(() => {
        if (!pending.delete(id)) return;
        if (onLateResult) {
          const expiry = window.setTimeout(() => lateResponses.delete(id), RESOURCE_READ_TIMEOUT_MS);
          lateResponses.set(id, { handle: onLateResult, expiry });
        }
        reject(new Error(`${method} request timed out after ${timeoutMs} ms`));
      }, timeoutMs);
      pending.set(id, { resolve, reject, timer });
      window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
    });
  }

  function notify(method, params) {
    window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
  }

  const parse = source => {
    try {
      return JSON.parse(source);
    } catch {
      return null;
    }
  };

  const data = result =>
    result?.structuredContent ||
    result?.content?.filter(block => block.type === 'text').map(block => parse(block.text)).find(Boolean) ||
    {};
  const png = result => result?.content?.find(block => block.type === 'image' && block.mimeType === 'image/png');
  const link = result => result?.content?.find(block => block.type === 'resource_link');
  const resourcePng = result =>
    result?.contents?.find(content => content?.mimeType === 'image/png' && typeof content.blob === 'string');

  function credentialKeyIn(value) {
    const remaining = [value];
    while (remaining.length) {
      const current = remaining.pop();
      if (!current || typeof current !== 'object') continue;
      for (const [key, child] of Object.entries(current)) {
        if (CREDENTIAL_KEY.test(key)) return key;
        const uriCredential = credentialKeyInUri(key, child);
        if (uriCredential) return uriCredential;
        if (child && typeof child === 'object') remaining.push(child);
      }
    }
    return undefined;
  }

  function credentialKeyInUri(key, value) {
    if (typeof value !== 'string') return undefined;
    try {
      const url = new URL(value, 'https://compose-preview.invalid/');
      if (url.username || url.password) return `${key} userinfo`;
      for (const [parameter] of url.searchParams) {
        if (CREDENTIAL_KEY.test(parameter)) return parameter;
      }
      for (const [parameter] of new URLSearchParams(url.hash.slice(1))) {
        if (CREDENTIAL_KEY.test(parameter)) return parameter;
      }
    } catch {
      // A malformed URI is handled by its consumer; it carries no parseable URL credential here.
    }
    return undefined;
  }

  function staticInput() {
    const encoded = new URLSearchParams(location.hash.slice(1)).get(STATIC_RESULT_PARAM);
    if (encoded == null) return { present: false };
    try {
      if (!encoded || encoded.length > MAX_STATIC_RESULT_BYTES || !/^[A-Za-z0-9_-]+$/.test(encoded)) {
        throw new Error('the encoded result is empty, malformed, or larger than 500 KB');
      }
      const base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
      const binary = atob(base64 + '='.repeat((4 - base64.length % 4) % 4));
      if (binary.length > MAX_STATIC_RESULT_BYTES) {
        throw new Error('the decoded result is larger than 500 KB');
      }
      const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
      const envelope = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
      if (!envelope || envelope.version !== 1 || typeof envelope.result !== 'object' || !envelope.result || Array.isArray(envelope.result)) {
        throw new Error('expected a version 1 envelope containing an MCP tool result');
      }
      if (
        !Array.isArray(envelope.result.content) ||
        !envelope.result.content.every(block => block && typeof block === 'object' && !Array.isArray(block))
      ) {
        throw new Error('the MCP tool result content must be an array of objects');
      }
      if (envelope.arguments != null && (typeof envelope.arguments !== 'object' || Array.isArray(envelope.arguments))) {
        throw new Error('arguments must be an object when present');
      }
      const value = data(envelope.result);
      if (
        Array.isArray(value?.cells) &&
        !value.cells.every(cell => cell && typeof cell === 'object' && !Array.isArray(cell))
      ) {
        throw new Error('matrix cells must be objects');
      }
      const credentialKey = credentialKeyIn(envelope);
      if (credentialKey) throw new Error(`credential field "${credentialKey}" is not allowed`);
      return { present: true, envelope };
    } catch (error) {
      return { present: true, error: error instanceof Error ? error.message : String(error) };
    }
  }

  // Selection context must be complete enough to replay a render, but never leak a transport
  // credential from the host's original tool input into the model context.
  function safeSelectionArguments(value) {
    if (Array.isArray(value)) {
      return value.map(safeSelectionArguments).filter(child => child !== undefined);
    }
    if (typeof value === 'string' && credentialKeyInUri('value', value)) return undefined;
    if (!value || typeof value !== 'object') return value;
    return Object.fromEntries(
      Object.entries(value)
        .filter(([key, child]) => !CREDENTIAL_KEY.test(key) && !credentialKeyInUri(key, child))
        .map(([key, child]) => [key, safeSelectionArguments(child)])
    );
  }

  function choose(value, label) {
    selected = value;
    use.hidden = staticMode;
    meta.textContent = label;
  }

  function showImage(data, alt = 'Rendered Compose preview') {
    const preview = document.createElement('img');
    preview.alt = alt;
    preview.src = `data:image/png;base64,${data}`;
    canvas.replaceChildren(preview);
  }

  function clearAccessibilityOverlay() {
    ++overlayGeneration;
    baseImageData = undefined;
    overlayImageData = undefined;
    overlayVisible = false;
    baseMetaText = '';
    a11y.hidden = true;
    a11y.disabled = false;
    a11y.textContent = 'Show accessibility overlay';
    a11y.removeAttribute('title');
  }

  function updateAccessibilityAction() {
    if (staticMode || !baseImageData || !initialized || !hostServerTools) {
      a11y.hidden = true;
      return;
    }
    a11y.hidden = false;
    a11y.disabled = false;
    a11y.textContent = overlayVisible ? 'Show original preview' : 'Show accessibility overlay';
    a11y.removeAttribute('title');
  }

  function renderMatrix(value, cells) {
    const grid = document.createElement('div');
    grid.className = 'grid';
    cells.forEach((cell, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'cell';
      if (typeof cell?.png === 'string') {
        const image = document.createElement('img');
        image.alt = `Matrix cell ${index + 1}`;
        image.src = `data:image/png;base64,${cell.png}`;
        button.append(image);
      }
      const overrides = document.createElement('code');
      overrides.textContent = JSON.stringify(cell?.overrides || {});
      button.append(overrides);
      button.addEventListener('click', () =>
        choose({
          kind: 'matrix-cell',
          uri: value.uri || toolArguments.uri,
          arguments: toolArguments,
          overrides: cell?.overrides || {},
        }, 'Selected matrix cell')
      );
      grid.append(button);
    });
    canvas.replaceChildren(grid);
  }

  function renderImage(image, value, resource) {
    ++overlayGeneration;
    baseImageData = image.data;
    overlayImageData = undefined;
    overlayVisible = false;
    showImage(baseImageData);
    const label = value.previewId || toolArguments.previewId || 'Preview render';
    choose({
      kind: 'preview',
      uri: value.uri || resource?.uri || toolArguments.uri,
      arguments: toolArguments,
      overrides: toolArguments.overrides,
      semanticsRef: value.semanticsRef,
    }, label);
    baseMetaText = label;
    updateAccessibilityAction();
  }

  function applyAccessibilityResult(result, generation) {
    if (generation !== overlayGeneration || !baseImageData) return;
    const image = png(result);
    if (result?.isError || typeof image?.data !== 'string' || !image.data) {
      showImage(baseImageData);
      overlayImageData = undefined;
      overlayVisible = false;
      a11y.hidden = false;
      a11y.disabled = true;
      a11y.textContent = 'Accessibility overlay unavailable';
      a11y.title = 'The host or preview backend did not provide an accessibility overlay.';
      meta.textContent = 'Accessibility overlay unavailable; original preview shown.';
      return;
    }
    overlayImageData = image.data;
    overlayVisible = true;
    showImage(overlayImageData, 'Compose preview with accessibility overlay');
    meta.textContent = 'Accessibility overlay';
    updateAccessibilityAction();
  }

  async function toggleAccessibilityOverlay() {
    if (!baseImageData || !initialized || !hostServerTools) return;
    if (overlayVisible) {
      overlayVisible = false;
      showImage(baseImageData);
      meta.textContent = baseMetaText;
      updateAccessibilityAction();
      return;
    }
    if (overlayImageData) {
      overlayVisible = true;
      showImage(overlayImageData, 'Compose preview with accessibility overlay');
      meta.textContent = 'Accessibility overlay';
      updateAccessibilityAction();
      return;
    }
    const uri = selected?.uri || toolArguments.uri;
    if (typeof uri !== 'string' || !uri) {
      applyAccessibilityResult({ isError: true }, overlayGeneration);
      return;
    }
    const generation = overlayGeneration;
    const argumentsValue = {
      uri,
      kind: 'a11y/overlay',
      inline: true,
      ...(selected?.overrides || toolArguments.overrides
        ? { overrides: selected?.overrides || toolArguments.overrides }
        : {}),
      ...(resourceToken ? { token: resourceToken } : {}),
    };
    const call = { generation };
    overlayCall = call;
    a11y.disabled = true;
    a11y.textContent = 'Loading accessibility overlay…';
    meta.textContent = 'Rendering accessibility overlay…';
    try {
      const result = await request(
        'tools/call',
        { name: 'render_preview_overlay', arguments: argumentsValue },
        RESOURCE_READ_TIMEOUT_MS,
      );
      applyAccessibilityResult(result, generation);
    } catch (error) {
      applyAccessibilityResult({ isError: true }, generation);
      console.warn('Failed to render the Compose Preview accessibility overlay:', error);
    } finally {
      window.setTimeout(() => {
        if (overlayCall === call) overlayCall = undefined;
      }, 250);
    }
  }

  function fallbackText(result) {
    const text = result?.content
      ?.filter(block => block?.type === 'text' && typeof block.text === 'string')
      .map(block => block.text)
      .join('\n\n');
    if (text) return text;
    if (result?.structuredContent) return JSON.stringify(result.structuredContent, null, 2);
    return '';
  }

  function renderFallback(result, reason, resource) {
    const message = document.createElement('div');
    message.className = 'fallback';
    const summary = document.createElement('p');
    summary.textContent = reason;
    message.append(summary);
    if (resource) {
      const uri = document.createElement('code');
      uri.textContent = resource.uri;
      message.append(uri);
    }
    const text = fallbackText(result);
    if (text) {
      const output = document.createElement('pre');
      output.textContent = text;
      message.append(output);
    }
    canvas.replaceChildren(message);
  }

  function renderResourceFallback(result, resource, reason) {
    renderFallback(result, reason || 'A render resource is available:', resource);
  }

  function renderStaticError(reason) {
    hasToolResult = true;
    renderFallback(undefined, `Unable to load the static preview result: ${reason}`);
    meta.textContent = 'Static result unavailable; use the complete text fallback.';
  }

  function stopResourcePolling() {
    if (resourcePollTimer == null) return;
    window.clearTimeout(resourcePollTimer);
    resourcePollTimer = undefined;
  }

  function scheduleResourcePoll(uri) {
    stopResourcePolling();
    if (!initialized || staticMode || hostResourceSubscriptions || resourceResult?.resource?.uri !== uri) return;
    resourcePollTimer = window.setTimeout(() => {
      resourcePollTimer = undefined;
      if (resourceResult?.resource?.uri === uri) readResource();
    }, RESOURCE_POLL_INTERVAL_MS);
  }

  function queueResourceSubscription(task) {
    const queued = resourceSubscriptionQueue.then(task, task);
    resourceSubscriptionQueue = queued.catch(() => {});
    return queued;
  }

  function recoverLateSubscription(uri) {
    void queueResourceSubscription(async () => {
      try {
        await request('resources/unsubscribe', { uri });
      } catch (error) {
        console.debug('Unable to clean up a late Compose Preview subscription:', error);
      }
      if (subscribedResourceUri === uri) subscribedResourceUri = undefined;
      if (resourceSubscriptionTargetUri === uri && hostResourceSubscriptions) {
        connectResourceUpdates(uri, false);
      }
    });
  }

  async function connectResourceUpdates(uri, initialReadPending) {
    const generation = ++resourceSubscriptionGeneration;
    stopResourcePolling();
    if (subscribedResourceUri === uri) return;
    try {
      await bridgeReady;
      if (!initialized || staticMode || generation !== resourceSubscriptionGeneration) return;
      if (!hostResourceSubscriptions) {
        if (!initialReadPending) scheduleResourcePoll(uri);
        return;
      }
      await queueResourceSubscription(async () => {
        if (
          generation !== resourceSubscriptionGeneration ||
          resourceSubscriptionTargetUri !== uri ||
          resourceResult?.resource?.uri !== uri
        ) return;
        await request(
          'resources/subscribe',
          { uri },
          REQUEST_TIMEOUT_MS,
          () => recoverLateSubscription(uri),
        );
        if (
          !initialized ||
          staticMode ||
          generation !== resourceSubscriptionGeneration ||
          resourceSubscriptionTargetUri !== uri ||
          resourceResult?.resource?.uri !== uri
        ) {
          try {
            await request('resources/unsubscribe', { uri });
          } catch (error) {
            console.debug('Unable to unsubscribe a stale Compose Preview resource:', error);
          }
          return;
        }
        subscribedResourceUri = uri;
      });
    } catch (error) {
      if (generation !== resourceSubscriptionGeneration || resourceResult?.resource?.uri !== uri) return;
      // MCP Apps 2026-01-26 exposes resources/read but not subscription proxying. A future host
      // may advertise serverResources.subscribe; if that path fails, retain today's bounded poll.
      hostResourceSubscriptions = false;
      // If the initial read is still running, its finally block observes the capability downgrade
      // and arms the poll. If it already settled, this failure must do so itself.
      if (resourceReadUri !== uri) scheduleResourcePoll(uri);
      console.debug('Resource subscriptions are unavailable; polling instead:', error);
    }
  }

  function disconnectResourceUpdates(nextUri) {
    ++resourceSubscriptionGeneration;
    ++resourceReadGeneration;
    resourceReadUri = undefined;
    refresh.disabled = false;
    resourceSubscriptionTargetUri = nextUri;
    stopResourcePolling();
    if (subscribedResourceUri === nextUri) return;
    const previous = subscribedResourceUri;
    subscribedResourceUri = undefined;
    if (!previous || !hostResourceSubscriptions || !initialized) return;
    void queueResourceSubscription(async () => {
      try {
        await request('resources/unsubscribe', { uri: previous });
      } catch (error) {
        console.debug('Unable to unsubscribe the previous Compose Preview resource:', error);
      }
    });
  }

  async function readResource() {
    if (!resourceResult) return;
    stopResourcePolling();
    const { result: toolResult, resource, value } = resourceResult;
    const generation = ++resourceReadGeneration;
    resourceReadUri = resource.uri;
    refresh.disabled = true;
    meta.textContent = 'Reading preview resource…';
    try {
      await bridgeReady;
      if (!initialized) throw new Error('MCP Apps bridge is unavailable');
      const params = { uri: resource.uri };
      if (resourceToken) params._meta = { 'compose-preview/token': resourceToken };
      const readResult = await request(
        'resources/read',
        params,
        RESOURCE_READ_TIMEOUT_MS,
      );
      const image = resourcePng(readResult);
      if (generation !== resourceReadGeneration || resourceResult?.resource?.uri !== resource.uri) return;
      if (!image) {
        renderResourceFallback(toolResult, resource, 'The host returned no PNG for resource:');
        meta.textContent = 'Resource has no PNG; use the text fallback.';
        return;
      }
      renderImage({ data: image.blob }, value, resource);
    } catch (error) {
      if (generation !== resourceReadGeneration || resourceResult?.resource?.uri !== resource.uri) return;
      // Resource reads are optional in MCP Apps hosts. Keep the durable URI and text result useful.
      renderResourceFallback(toolResult, resource, 'Unable to read preview resource:');
      meta.textContent = 'Resource reads are unavailable; use the text fallback.';
      console.warn('Failed to read Compose Preview resource:', error);
    } finally {
      if (generation === resourceReadGeneration && resourceResult?.resource?.uri === resource.uri) {
        resourceReadUri = undefined;
        refresh.disabled = false;
        if (subscribedResourceUri !== resource.uri) scheduleResourcePoll(resource.uri);
      }
    }
  }

  function draw(result) {
    hasToolResult = true;
    if (staticMode) meta.textContent = 'Static preview result';
    const value = data(result);
    const image = png(result);
    const resource = link(result);
    selected = undefined;
    use.hidden = true;
    refresh.hidden = true;
    clearAccessibilityOverlay();
    disconnectResourceUpdates(resource?.uri);
    resourceResult = undefined;
    const cells = Array.isArray(value.cells) && value.cells;
    if (resource) {
      resourceResult = { result, resource, value };
      refresh.hidden = staticMode;
      if (!staticMode) connectResourceUpdates(resource.uri, !image && !cells);
    }
    if (cells) {
      if (image && !cells.some(cell => typeof cell?.png === 'string' && cell.png.length > 0)) {
        renderImage(image, value, resource);
        return;
      }
      renderMatrix(value, cells);
      return;
    }
    if (image) {
      renderImage(image, value, resource);
      return;
    }
    if (resource) {
      renderResourceFallback(
        result,
        resource,
        staticMode ? 'Static result links to this replayable render resource:' : undefined,
      );
      if (!staticMode) readResource();
      return;
    }
    renderFallback(result, 'The result has no PNG. Complete text and structured output:');
  }

  window.addEventListener('message', event => {
    if (staticMode) return;
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== '2.0') return;
    if (pending.has(message.id)) {
      const request = pending.get(message.id);
      pending.delete(message.id);
      window.clearTimeout(request.timer);
      if (message.error) request.reject(message.error);
      else request.resolve(message.result);
      return;
    }
    if (lateResponses.has(message.id)) {
      const late = lateResponses.get(message.id);
      lateResponses.delete(message.id);
      window.clearTimeout(late.expiry);
      if (!message.error) late.handle(message.result);
      return;
    }
    if (message.method === 'ui/notifications/tool-input') {
      const incomingArguments = message.params?.arguments || {};
      if (overlayCall && incomingArguments.kind === 'a11y/overlay') return;
      resourceToken = typeof incomingArguments.token === 'string' && incomingArguments.token
        ? incomingArguments.token
        : undefined;
      toolArguments = safeSelectionArguments(incomingArguments);
      return;
    }
    if (message.method === 'ui/notifications/tool-result') {
      const incomingResult = message.params?.result || message.params;
      if (overlayCall && (incomingResult?.isError || (png(incomingResult) && !link(incomingResult)))) {
        applyAccessibilityResult(incomingResult, overlayCall.generation);
        return;
      }
      draw(incomingResult);
    }
    if (
      (message.method === 'notifications/resources/updated' ||
        message.method === 'ui/notifications/resource-updated') &&
      message.params?.uri === resourceResult?.resource?.uri
    ) {
      readResource();
    }
  }, { passive: true });

  async function initializeBridge() {
    try {
      const result = await request('ui/initialize', {
        appInfo: { name: 'compose-preview-viewer', version: '1' },
        appCapabilities: {},
        protocolVersion: '2026-01-26',
      });
      hostResourceSubscriptions = result?.hostCapabilities?.serverResources?.subscribe === true;
      hostServerTools = result?.hostCapabilities?.serverTools != null;
      initialized = true;
      notify('ui/notifications/initialized', {});
      updateAccessibilityAction();
    } catch (error) {
      use.hidden = true;
      refresh.hidden = true;
      if (hasToolResult) {
        meta.textContent = `${meta.textContent}; viewer actions unavailable.`;
      } else {
        const message = document.createElement('div');
        message.className = 'empty';
        message.textContent = 'The MCP Apps bridge is unavailable. Use the complete text fallback in the surrounding response.';
        canvas.replaceChildren(message);
        meta.textContent = 'Viewer unavailable; use the complete text fallback.';
      }
      console.error('Failed to initialize the MCP Apps bridge:', error);
    }
  }

  const fromHash = staticInput();
  if (fromHash.present) {
    staticMode = true;
    if (fromHash.error) {
      renderStaticError(fromHash.error);
    } else {
      toolArguments = safeSelectionArguments(fromHash.envelope.arguments || {});
      draw(fromHash.envelope.result);
    }
  }

  const bridgeReady = staticMode ? Promise.resolve() : initializeBridge();
  refresh.addEventListener('click', () => readResource());
  a11y.addEventListener('click', () => toggleAccessibilityOverlay());
  use.addEventListener('click', async () => {
    await bridgeReady;
    if (!initialized || !selected) return;
    await request('ui/update-model-context', {
      content: [{ type: 'text', text: `User selected Compose Preview context: ${JSON.stringify(selected)}` }],
      structuredContent: { composePreviewSelection: selected },
    });
  });
})();
</script>
