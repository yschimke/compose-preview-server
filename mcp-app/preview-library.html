<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compose Previews</title>
<!--
  The Compose Preview library as an MCP App (compose-preview-server #1241). Served as
  ui://compose-preview/library by the local server (previews_library, settings_register_project)
  and by the hosted catalog server (catalog_library, ui_builder_open). It is its own asset rather
  than a mode of compose-preview-viewer.html so the two can change independently.

  Everything it needs arrives in the opening tool result's structuredContent
  (schema "compose-preview-library/v1"):
    mode        "library" | "register" | "designs"
    host        "local" | "hosted"
    tools       { refresh, render, register, listDesigns, view } — the tool names to call back
    renderArgs  extra arguments for tools.render (the library always asks for pixels)
    renderVia   "tool" (default) or "resource" — read the preview URI with resources/read instead
    projects    [{ id, name, path, modules: [{ path, previews: [{ uri, name, displayName, ... }] }] }]

  Deep links: hostContext["openai/deepLink"].url, at ui/initialize and on
  ui/notifications/host-context-changed. Routes: /, /project/<id>, /preview/<encoded uri>,
  /design/<id>. OpenAiDeepLinks.kt builds the links; LibraryRoute parses the same shapes.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, #fff);
    --bg2: var(--color-background-secondary, #f4f4f6);
    --fg: var(--color-text-primary, #1b1b1f);
    --fg2: var(--color-text-secondary, #62626b);
    --line: var(--color-border-primary, #dcdce2);
    --accent: var(--color-text-info, #2458d6);
    --sel: var(--color-background-info, #e6edff);
    font: 13px/1.4 var(--font-sans, system-ui, sans-serif);
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #17171a); --bg2: var(--color-background-secondary, #222227);
    --fg: var(--color-text-primary, #ececf1); --fg2: var(--color-text-secondary, #a0a0aa);
    --line: var(--color-border-primary, #36363d); --accent: var(--color-text-info, #8fb0ff);
    --sel: var(--color-background-info, #26324f);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
  header .count { color: var(--fg2); white-space: nowrap; }
  input[type=search], input[type=text] { flex: 1; min-width: 0; font: inherit; color: inherit; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  button { font: inherit; color: inherit; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; display: grid; grid-template-columns: minmax(220px, 34%) 1fr; min-height: 0; }
  nav { border-right: 1px solid var(--line); overflow: auto; padding: 6px 0; }
  .project > .row { font-weight: 600; }
  .row { display: flex; gap: 6px; align-items: baseline; padding: 4px 12px; cursor: pointer; user-select: none; }
  .row:hover { background: var(--bg2); }
  .row.selected { background: var(--sel); }
  .row .meta { color: var(--fg2); font-weight: 400; font-size: 12px; margin-left: auto; white-space: nowrap; }
  .row .twisty { width: 10px; color: var(--fg2); flex: none; }
  .module > .row { padding-left: 26px; font-family: var(--font-mono, ui-monospace, monospace); font-size: 12px; }
  .preview.row { padding-left: 42px; }
  .preview .sub { color: var(--fg2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preview .name { white-space: nowrap; }
  .collapsed > .children { display: none; }
  section#pane { overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  #pane h2 { font-size: 15px; margin: 0; }
  .uri { font-family: var(--font-mono, ui-monospace, monospace); font-size: 11px; color: var(--fg2); overflow-wrap: anywhere; }
  .stage { flex: 1; display: flex; align-items: flex-start; justify-content: center; background: var(--bg2); border-radius: 12px; padding: 16px; min-height: 200px; }
  .stage img { max-width: 100%; height: auto; box-shadow: 0 1px 4px rgb(0 0 0 / .25); border-radius: 4px; background: #fff; }
  .empty { color: var(--fg2); padding: 12px; }
  .status { color: var(--fg2); font-size: 12px; }
  .error { color: var(--color-text-danger, #c5221f); white-space: pre-wrap; }
  form.register { display: flex; gap: 8px; }
  @media (max-width: 640px) { main { grid-template-columns: 1fr; } nav { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
<body>
<header>
  <h1 id="title">Compose Previews</h1>
  <input id="search" type="search" placeholder="Search previews" aria-label="Search previews">
  <span class="count" id="count"></span>
  <button id="refresh" title="Refresh">Refresh</button>
</header>
<main>
  <nav id="tree" aria-label="Projects"><div class="empty">Waiting for the host…</div></nav>
  <section id="pane"><div class="empty">Select a preview to render it.</div></section>
</main>
<script>
(() => {
  'use strict';
  const REQUEST_TIMEOUT_MS = 120_000;
  const $ = id => document.getElementById(id);
  const pending = new Map();
  let nextId = 1;
  const state = {
    data: null,          // structuredContent of the opening result
    expanded: new Set(), // project ids and project::module keys
    selected: null,      // preview uri or design id
    query: '',
    route: null,
    designs: null,
  };

  // ---- MCP Apps bridge ------------------------------------------------------------------------
  function request(method, params) {
    const id = nextId++;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        if (pending.delete(id)) reject(new Error(`${method} timed out`));
      }, REQUEST_TIMEOUT_MS);
      pending.set(id, { resolve, reject, timer, method });
      window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
    });
  }
  const notify = (method, params) => window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
  const callTool = (name, args) => request('tools/call', { name, arguments: args || {} });

  window.addEventListener('message', event => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== '2.0') return;
    if (message.id != null && !message.method && pending.has(message.id)) {
      const slot = pending.get(message.id);
      pending.delete(message.id);
      clearTimeout(slot.timer);
      if (message.error) slot.reject(new Error(message.error.message || JSON.stringify(message.error)));
      else slot.resolve(message.result);
      return;
    }
    switch (message.method) {
      case 'ui/notifications/tool-result':
        accept(message.params);
        break;
      case 'ui/notifications/host-context-changed':
        applyHostContext(message.params || {});
        break;
      default:
        if (message.id != null && message.method) {
          window.parent.postMessage({ jsonrpc: '2.0', id: message.id, result: {} }, '*');
        }
    }
  });

  // ---- Host context: theme and deep links -----------------------------------------------------
  function applyHostContext(ctx) {
    if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) if (v) document.documentElement.style.setProperty(k, v);
    if (Object.prototype.hasOwnProperty.call(ctx, 'openai/deepLink')) {
      const url = deepLinkUrl(ctx['openai/deepLink']);
      if (url) { state.route = parseRoute(url); applyRoute(); }
    }
  }

  // `{url}` per the spec; older hosts sent `{path: [...], query: [[k, v], ...]}`.
  function deepLinkUrl(link) {
    if (!link) return null;
    if (typeof link.url === 'string') return link.url;
    if (Array.isArray(link.path)) {
      const search = new URLSearchParams(link.query || []).toString();
      return '/' + link.path.map(encodeURIComponent).join('/') + (search ? '?' + search : '');
    }
    return null;
  }

  function parseRoute(url) {
    if (!url.startsWith('/') || url.includes('#')) return { kind: 'home' };
    const path = url.split('?')[0].replace(/\/+$/, '');
    if (!path) return { kind: 'home' };
    const parts = path.slice(1).split('/');
    if (parts.length !== 2 || !parts[1]) return { kind: 'home' };
    let value;
    try { value = decodeURIComponent(parts[1]); } catch { return { kind: 'home' }; }
    if (['project', 'preview', 'design'].includes(parts[0])) return { kind: parts[0], value };
    return { kind: 'home' };
  }

  function applyRoute() {
    const route = state.route;
    if (!route || !state.data) return;
    if (route.kind === 'project') {
      state.expanded.add(route.value);
      for (const m of (projectById(route.value)?.modules || [])) state.expanded.add(route.value + '::' + m.path);
      renderTree();
      if (state.data.tools?.refresh) void refresh(route.value);
      scrollTo(route.value);
    } else if (route.kind === 'preview') {
      const found = findPreview(route.value);
      if (found) {
        state.expanded.add(found.project.id);
        state.expanded.add(found.project.id + '::' + found.module.path);
      }
      select(route.value, found?.preview);
    } else if (route.kind === 'design') {
      if (state.data.mode === 'designs') void openDesign(route.value);
    }
  }

  // ---- Data -----------------------------------------------------------------------------------
  function accept(result) {
    const data = result?.structuredContent;
    if (!data || data.schema !== 'compose-preview-library/v1') return;
    const previous = state.data;
    // A refresh scoped to one project (hosted: one catalog) lists the others without previews;
    // keep what was already loaded for them.
    if (previous && data.mode === previous.mode) {
      for (const project of data.projects || []) {
        const before = (previous.projects || []).find(p => p.id === project.id);
        if (before && !(project.modules || []).length && (before.modules || []).length) project.modules = before.modules;
      }
    }
    state.data = data;
    if (!previous) {
      $('title').textContent = data.mode === 'designs' ? 'UI Builder designs'
        : data.mode === 'register' ? 'Register a project' : 'Compose Previews';
      if ((data.projects || []).length === 1) state.expanded.add(data.projects[0].id);
    }
    render();
    if (!previous) {
      $('search').placeholder = data.mode === 'designs' ? 'Search designs' : 'Search previews';
      if (data.mode === 'designs') void loadDesigns().then(applyRoute);
      else applyRoute();
    }
  }

  const projectById = id => (state.data?.projects || []).find(p => p.id === id);
  function findPreview(uri) {
    for (const project of state.data?.projects || [])
      for (const module of project.modules || [])
        for (const preview of module.previews || [])
          if (preview.uri === uri) return { project, module, preview };
    return null;
  }

  async function refresh(projectId) {
    const tool = state.data?.tools?.refresh;
    if (!tool) return;
    $('refresh').disabled = true;
    try {
      const result = await callTool(tool, projectId ? { projectId } : {});
      accept(result);
    } catch (err) {
      showError('Refresh failed', err);
    } finally {
      $('refresh').disabled = false;
    }
  }

  // ---- Rendering ------------------------------------------------------------------------------
  function render() {
    const mode = state.data?.mode;
    $('search').hidden = mode === 'register';
    if (mode === 'register') renderRegister();
    else if (mode === 'designs') renderDesigns();
    else renderTree();
  }

  function matches(preview) {
    const q = state.query;
    if (!q) return true;
    return [preview.name, preview.displayName, preview.uri, preview.sourceFile]
      .some(s => s && s.toLowerCase().includes(q));
  }

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') node.className = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else if (v != null) node.setAttribute(k, v);
    }
    for (const child of children) if (child != null) node.append(child);
    return node;
  }

  function renderTree() {
    const tree = $('tree');
    tree.replaceChildren();
    const projects = state.data?.projects || [];
    let total = 0, shown = 0;
    if (!projects.length) {
      tree.append(el('div', { class: 'empty' }, state.data?.host === 'hosted'
        ? 'No catalogs are served here.'
        : 'No projects are registered yet. Ask the agent to register one, or use "Register project…" in the plugin settings.'));
    }
    for (const project of projects) {
      const modules = project.modules || [];
      const count = modules.reduce((n, m) => n + (m.previews || []).length, 0);
      total += count;
      if (state.query && !modules.some(m => (m.previews || []).some(matches))) continue;
      const open = state.expanded.has(project.id) || !!state.query;
      const node = el('div', { class: 'project' + (open ? '' : ' collapsed'), 'data-id': project.id });
      node.append(el('div', { class: 'row', title: project.path || project.id, onclick: () => toggle(project.id, true) },
        el('span', { class: 'twisty' }, open ? '▾' : '▸'), el('span', {}, project.name || project.id),
        el('span', { class: 'meta' }, project.previewCount != null && !modules.length ? String(project.previewCount) : modules.length ? String(count) : '…')));
      const children = el('div', { class: 'children' });
      if (!modules.length) children.append(el('div', { class: 'empty' }, state.data.host === 'hosted'
        ? 'Loading its previews…' : 'Not discovered yet. Opening it starts its daemons; refresh in a moment.'));
      for (const module of modules) {
        const key = project.id + '::' + module.path;
        const previews = (module.previews || []).filter(matches);
        shown += previews.length;
        if (state.query && !previews.length) continue;
        const mOpen = state.expanded.has(key) || !!state.query || modules.length === 1;
        const mNode = el('div', { class: 'module' + (mOpen ? '' : ' collapsed') });
        mNode.append(el('div', { class: 'row', onclick: () => toggle(key) },
          el('span', { class: 'twisty' }, mOpen ? '▾' : '▸'), el('span', {}, module.path || project.name),
          el('span', { class: 'meta' }, String((module.previews || []).length))));
        const list = el('div', { class: 'children' });
        if (!(module.previews || []).length) list.append(el('div', { class: 'empty' }, 'No previews discovered in this module yet.'));
        for (const preview of previews) {
          list.append(el('div', {
            class: 'preview row' + (state.selected === preview.uri ? ' selected' : ''), role: 'button', tabindex: '0',
            title: preview.uri, onclick: () => select(preview.uri, preview),
            onkeydown: e => { if (e.key === 'Enter') select(preview.uri, preview); },
          }, el('div', {}, el('div', { class: 'name' }, preview.displayName || preview.name),
            preview.sourceFile ? el('div', { class: 'sub' }, preview.sourceFile + (preview.sourceLine ? ':' + preview.sourceLine : '')) : null)));
        }
        mNode.append(list);
        children.append(mNode);
      }
      node.append(children);
      tree.append(node);
    }
    $('count').textContent = state.query ? `${shown} of ${total}` : total ? `${total} previews` : '';
  }

  function toggle(key, isProject) {
    if (state.expanded.has(key)) state.expanded.delete(key);
    else {
      state.expanded.add(key);
      const project = isProject && projectById(key);
      if (project && !(project.modules || []).length) void refresh(key);
    }
    renderTree();
  }

  function scrollTo(id) {
    const node = document.querySelector(`[data-id="${CSS.escape(id)}"]`);
    if (node) node.scrollIntoView({ block: 'start' });
  }

  async function select(uri, preview) {
    state.selected = uri;
    renderTree();
    const pane = $('pane');
    const status = el('div', { class: 'status' }, 'Rendering…');
    const stage = el('div', { class: 'stage' });
    pane.replaceChildren(el('h2', {}, preview?.displayName || preview?.name || uri.split('/').pop()),
      el('div', { class: 'uri' }, uri), status, stage);
    try {
      const png = await renderPreview(uri);
      if (state.selected !== uri) return;
      if (png) {
        stage.append(el('img', { src: png, alt: preview?.name || uri }));
        status.textContent = '';
      } else status.textContent = 'The render returned no image.';
    } catch (err) {
      if (state.selected !== uri) return;
      status.replaceChildren(el('div', { class: 'error' }, String(err.message || err)));
    }
  }

  async function renderPreview(uri) {
    const data = state.data;
    if (data.renderVia === 'resource') {
      const read = await request('resources/read', { uri });
      const blob = (read?.contents || []).find(c => c.blob);
      return blob ? `data:${blob.mimeType || 'image/png'};base64,${blob.blob}` : null;
    }
    const result = await callTool(data.tools.render, { uri, ...(data.renderArgs || {}) });
    if (result?.isError) throw new Error(textOf(result) || 'render failed');
    return imageOf(result);
  }

  const textOf = result => (result?.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
  function imageOf(result) {
    const image = (result?.content || []).find(c => c.type === 'image');
    if (image) return `data:${image.mimeType || 'image/png'};base64,${image.data}`;
    const link = (result?.content || []).find(c => c.type === 'text' && /^https:\/\//.test(c.text?.trim?.() || ''));
    return link ? link.text.trim() : null;
  }

  function showError(title, err) {
    $('pane').replaceChildren(el('h2', {}, title), el('div', { class: 'error' }, String(err?.message || err)));
  }

  // ---- Register mode (settings page modal) ----------------------------------------------------
  function renderRegister() {
    $('tree').replaceChildren(...(state.data.projects || []).map(p =>
      el('div', { class: 'row', title: p.path }, el('span', {}, p.name), el('span', { class: 'meta' }, p.path || ''))));
    if (!(state.data.projects || []).length) $('tree').append(el('div', { class: 'empty' }, 'No projects registered yet.'));
    const input = el('input', { type: 'text', placeholder: '/path/to/gradle/project', 'aria-label': 'Project path' });
    const out = el('div', { class: 'status' });
    const form = el('form', { class: 'register', onsubmit: async e => {
      e.preventDefault();
      const path = input.value.trim();
      if (!path) return;
      out.textContent = 'Registering…';
      try {
        const result = await callTool(state.data.tools.register, { path });
        if (result?.isError) throw new Error(textOf(result));
        out.textContent = 'Registered. It warms up in the background.';
        await refresh();
      } catch (err) { out.replaceChildren(el('div', { class: 'error' }, String(err.message || err))); }
    } }, input, el('button', { type: 'submit' }, 'Register'));
    $('pane').replaceChildren(el('h2', {}, 'Register a Gradle project'),
      el('div', { class: 'status' }, 'The folder that holds settings.gradle(.kts). Its previews appear in the library once discovered.'), form, out);
  }

  // ---- Designs mode (hosted ui_builder_open) --------------------------------------------------
  async function loadDesigns() {
    try {
      const result = await callTool(state.data.tools.listDesigns, {});
      if (result?.isError) throw new Error(textOf(result));
      state.designs = designsFrom(result);
      renderDesigns();
    } catch (err) {
      $('tree').replaceChildren(el('div', { class: 'error' }, String(err.message || err)));
    }
  }

  // Tolerant: take any array of objects carrying a design id.
  function designsFrom(result) {
    let body = result?.structuredContent;
    if (!body) { try { body = JSON.parse(textOf(result)); } catch { body = null; } }
    const out = [];
    const visit = v => {
      if (Array.isArray(v)) v.forEach(visit);
      else if (v && typeof v === 'object') {
        const id = v.designId || (v.id && (v.name || v.title) ? v.id : null);
        if (typeof id === 'string') out.push({ id, name: v.name || v.title || id });
        else Object.values(v).forEach(visit);
      }
    };
    visit(body);
    return out;
  }

  function renderDesigns() {
    const designs = (state.designs || []).filter(d => !state.query || (d.name + d.id).toLowerCase().includes(state.query));
    $('tree').replaceChildren(...designs.map(d => el('div', {
      class: 'row' + (state.selected === d.id ? ' selected' : ''), onclick: () => openDesign(d.id),
    }, el('span', {}, d.name), el('span', { class: 'meta' }, d.id))));
    if (state.designs && !designs.length) $('tree').append(el('div', { class: 'empty' }, 'No designs.'));
    if (!state.designs) $('tree').append(el('div', { class: 'empty' }, 'Loading designs…'));
    $('count').textContent = state.designs ? `${state.designs.length} designs` : '';
  }

  async function openDesign(id) {
    state.selected = id;
    renderDesigns();
    const status = el('div', { class: 'status' }, 'Drawing…');
    const stage = el('div', { class: 'stage' });
    const name = (state.designs || []).find(d => d.id === id)?.name;
    $('pane').replaceChildren(el('h2', {}, name || id), name ? el('div', { class: 'uri' }, id) : null, status, stage);
    try {
      const result = await callTool(state.data.tools.view, { designId: id, inline: true });
      if (result?.isError) throw new Error(textOf(result));
      const png = imageOf(result);
      if (png) { stage.append(el('img', { src: png, alt: id })); status.textContent = ''; }
      else status.textContent = 'No picture returned.';
    } catch (err) { status.replaceChildren(el('div', { class: 'error' }, String(err.message || err))); }
  }

  // ---- Wiring ---------------------------------------------------------------------------------
  $('search').addEventListener('input', e => { state.query = e.target.value.trim().toLowerCase(); render(); });
  $('refresh').addEventListener('click', () => state.data?.mode === 'designs' ? loadDesigns() : refresh());

  async function initialize() {
    try {
      const result = await request('ui/initialize', {
        appInfo: { name: 'compose-preview-library', version: '1' },
        appCapabilities: { availableDisplayModes: ['fullscreen', 'inline'] },
        protocolVersion: '2026-01-26',
      });
      applyHostContext(result?.hostContext || {});
      notify('ui/notifications/initialized', {});
    } catch (err) {
      $('tree').replaceChildren(el('div', { class: 'error' }, 'The host did not answer ui/initialize: ' + (err.message || err)));
    }
  }
  void initialize();
})();
</script>
</body>
</html>
