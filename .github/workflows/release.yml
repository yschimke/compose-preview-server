name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Quoted: the `chore(main): release ` literal contains `: `, which YAML would otherwise read as a
  # nested mapping. A merged release PR gets its own slot so an ordinary push cannot replace it
  # while the publish is still pending.
  group: "release-${{ github.ref }}-${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release ') && github.sha || 'updates' }}"
  cancel-in-progress: false

jobs:
  # The release half. `skip-github-pull-request` is deliberate — the PR half is `update-release-pr`
  # below. A single invocation computes the next candidate PR in the same run that cuts the
  # release, and because our releases are drafts (`"draft": true` in release-please-config.json)
  # that half reads the PREVIOUS release as its baseline and re-proposes the version being
  # released. That produced a phantom PR in compose-preview-vscode#5.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # A draft release does not create its tag — GitHub writes the ref only on publish — and
      # `publish` below checks out `ref: <tag>`, then addresses the release by that tag for the
      # asset upload and the un-drafting. Without this the first release cuts a draft and then
      # dies at checkout. Idempotent, and `!cancelled()` so a late failure in the action cannot
      # leave the manifest naming a version with no tag.
      - name: Ensure the release tag exists for the draft
        if: ${{ !cancelled() && steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/{owner}/{repo}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists"
            exit 0
          fi
          gh api --method POST "repos/{owner}/{repo}/git/refs" \
            -f "ref=refs/tags/${TAG}" -f "sha=${SHA}" >/dev/null
          echo "created tag ${TAG} at ${SHA}"

  # The distribution lane. Builds and attaches both standalone archives; `compose-preview serve` and
  # `compose-preview mcp serve` in the CLI fetch THESE, so a release missing either is a command
  # that cannot start. Deliberately does NOT un-draft - `finish-release` does that once every lane
  # this release asked for has succeeded.
  #
  # It also attaches the UI-builder web bundle on its own. The server archive already carries it
  # (`server/build.gradle.kts` unpacks it into `ui-builder/`), and it is on Maven Central as
  # `compose-preview-ui-builder-web` - but neither is reachable for someone who wants only the
  # bundle: to serve it themselves, to put it in an image, or to point an existing `serve` at it
  # with `--ui-builder-dir`. A release asset is the one form that needs no Gradle and no Maven.
  publish-distributions:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PLUGIN_VERSION: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Derive version from tag
        run: echo "PLUGIN_VERSION=${PLUGIN_VERSION#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Two JDKs, because this build has two JVM floors: `java-server` (17) for everything a
          # consumer compiles against, and `java-ui-builder` (21) for the UI-builder frontend lane.
          # See the top of `gradle/libs.versions.toml`. 17 is last, so it is `JAVA_HOME` and Gradle
          # itself runs on the floor the distribution ships for; the 21 install is reached as a
          # toolchain through `org.gradle.java.installations.fromEnv` in `gradle.properties`, which
          # names the `JAVA_HOME_<version>_<arch>` variables this action exports.
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Build the standalone distributions
        run: ./gradlew :server:distTar :mcp:distTar :ui-builder-web:webArchive
      - name: Upload standalone server distribution
        run: >-
          gh release upload "${{ needs.release-please.outputs.tag_name }}"
          "server/build/distributions/compose-preview-server-${PLUGIN_VERSION}.tar.gz"
          --clobber
      - name: Upload standalone MCP server distribution
        run: >-
          gh release upload "${{ needs.release-please.outputs.tag_name }}"
          "mcp/build/distributions/compose-preview-mcp-${PLUGIN_VERSION}.tar.gz"
          --clobber
      # The same archive `:ui-builder-web` publishes to Maven Central, attached under the same name
      # it has there, so the two can be compared byte for byte.
      - name: Upload UI-builder web bundle
        run: >-
          gh release upload "${{ needs.release-please.outputs.tag_name }}"
          "ui-builder-web/build/distributions/compose-preview-ui-builder-web-${PLUGIN_VERSION}.zip"
          --clobber

  # One release goes out, or none does. The GitHub release stays a DRAFT until the distribution lane
  # has succeeded, so a failed build cannot leave a tag whose assets do not exist - which is the
  # shape of the 3.3.0 breakage, arrived at by a different road. There is no second lane to wait on
  # now: the tarballs and the web bundle ARE the release.
  finish-release:
    needs: [release-please, publish-distributions]
    if: ${{ !cancelled() && needs.publish-distributions.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout in this job, so `gh` has no git remote to infer the repository from.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish the draft GitHub release
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false --latest

  resolve-preview-host-tools:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tools.outputs.version }}
      daemon_version: ${{ steps.tools.outputs.daemon_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Read the compose-ai-tools and compose-preview-daemon versions used by the server
        id: tools
        run: |
          set -euo pipefail
          version="$(sed -n 's/^composeai-tools = "\([^"]*\)"$/\1/p' gradle/libs.versions.toml)"
          test -n "${version}" || {
            echo "::error::composeai-tools is missing from gradle/libs.versions.toml"
            exit 1
          }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # The daemon sidecars left compose-ai-tools for compose-preview-daemon
          # (compose-ai-tools#5336); the image fetches them at this pin.
          daemon="$(sed -n 's/^composeai-preview-daemon = "\([^"]*\)"$/\1/p' gradle/libs.versions.toml)"
          test -n "${daemon}" || {
            echo "::error::composeai-preview-daemon is missing from gradle/libs.versions.toml"
            exit 1
          }
          echo "daemon_version=${daemon}" >> "$GITHUB_OUTPUT"

  preview-host-image:
    needs: [release-please, finish-release, resolve-preview-host-tools]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
      pull-requests: write
    uses: ./.github/workflows/preview-host-image.yml
    with:
      server_version: ${{ needs.release-please.outputs.tag_name }}
      # The image's sidecars must be the same releases as the server's runtime dependencies. A
      # separate repository variable silently stayed at 1.53.0 while the Gradle pin moved on, so
      # new server images kept shipping an old Android daemon (#4822). Two pins since the daemons
      # moved to compose-preview-daemon: `tools_version` for what still ships from compose-ai-tools
      # (`lib-rcjvm/`, `lib-bta/`), `daemon_version` for the Android and desktop daemons.
      tools_version: ${{ needs.resolve-preview-host-tools.outputs.version }}
      daemon_version: ${{ needs.resolve-preview-host-tools.outputs.daemon_version }}
    secrets:
      DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
      SERVE_ADMIN_TOKEN: ${{ secrets.SERVE_ADMIN_TOKEN }}

  # The PR half, split out so it never runs against a half-published release. Runs on an ordinary
  # push (the normal case) or straight after a SUCCESSFUL release, so the next release PR opens
  # against a baseline that includes the release just made. Deliberately not after a failed
  # publish: the baseline is stale in exactly the way that produces a phantom PR.
  #
  # `!cancelled()` rather than `success()` because `finish-release` is skipped on an ordinary push,
  # and a skipped dependency would otherwise skip this job too.
  update-release-pr:
    needs: [release-please, finish-release]
    if: >-
      ${{ !cancelled()
      && (needs.release-please.outputs.release_created != 'true'
      || needs.finish-release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
