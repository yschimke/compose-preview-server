name: Publish preview-host image

on:
  workflow_dispatch:
    inputs:
      server_version:
        description: Released compose-preview-server version (leading v optional)
        required: true
      tools_version:
        description: Released compose-ai-tools version supplying lib-rcjvm and lib-bta
        required: true
      daemon_version:
        description: Released compose-preview-daemon version supplying the Android and desktop daemons
        required: true
  workflow_call:
    inputs:
      server_version:
        required: true
        type: string
      tools_version:
        required: true
        type: string
      daemon_version:
        required: true
        type: string
    secrets:
      DEPLOY_HOOK_TOKEN: {required: false}
      SERVE_ADMIN_TOKEN: {required: false}

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve versions
        id: versions
        env:
          RAW_SERVER: ${{ inputs.server_version }}
          RAW_TOOLS: ${{ inputs.tools_version }}
          RAW_DAEMON: ${{ inputs.daemon_version }}
        run: |
          server="${RAW_SERVER#v}"
          tools="${RAW_TOOLS#v}"
          daemon="${RAW_DAEMON#v}"
          test -n "${server}" || { echo "::error::server_version is empty"; exit 1; }
          test -n "${tools}" || { echo "::error::tools_version is empty"; exit 1; }
          test -n "${daemon}" || { echo "::error::daemon_version is empty"; exit 1; }
          echo "server=${server}" >> "$GITHUB_OUTPUT"
          echo "tools=${tools}" >> "$GITHUB_OUTPUT"
          echo "daemon=${daemon}" >> "$GITHUB_OUTPUT"
      - name: Prepare image context
        run: |
          mkdir -p deploy/image/release-assets deploy/image/scripts
          touch deploy/image/release-assets/.keep
          cp scripts/install-linux-font-fallbacks.sh deploy/image/scripts/
      - name: Wait for the standalone distribution
        env:
          V: ${{ steps.versions.outputs.server }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${V}/compose-preview-server-${V}.tar.gz"
          for i in $(seq 1 20); do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' -r 0-0 "$url" || true)
            if [ "$code" = 200 ] || [ "$code" = 206 ]; then exit 0; fi
            echo "waiting for server ${V} distribution (attempt ${i}/20)"
            sleep 30
          done
          echo "::error::standalone distribution is not resolvable: ${url}"
          exit 1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/compose-preview-host
          tags: |
            type=raw,value=${{ steps.versions.outputs.server }}
            type=raw,value=latest
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: push
        with:
          context: deploy/image
          file: deploy/image/Dockerfile
          build-args: |
            SERVER_VERSION=${{ steps.versions.outputs.server }}
            TOOLS_VERSION=${{ steps.versions.outputs.tools }}
            DAEMON_VERSION=${{ steps.versions.outputs.daemon }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Notify preview.coo.ee and verify rollout
        id: rollout
        env:
          HOOK_URL: ${{ vars.DEPLOY_HOOK_URL || 'https://preview.coo.ee/__hooks/rollout' }}
          HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
        run: |
          if [[ -z "${HOOK_TOKEN}" ]]; then
            echo "DEPLOY_HOOK_TOKEN is unset; skipping rollout notification"
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 30 \
            -X POST -H "Authorization: Bearer ${HOOK_TOKEN}" "${HOOK_URL}" 2>/dev/null || echo 000)
          case "${code}" in
            200|202) ;;
            *) echo "::warning::deploy hook returned ${code}; waiting for the box poller" ;;
          esac
          base="${HOOK_URL%/__hooks/rollout}"
          # CONVERGED, as a function, so `.github/scripts/test-preview-host-rollout.sh` can extract
          # and exercise it without a network. What it rejects is the reason it exists:
          #
          #   * A SPLIT during the swap. Two containers answer this host while the new one takes
          #     over, so `/version` can report the new build in the same second that
          #     `/status.json` reports the old one -- observed on the 3.27.0 rollout, /version
          #     3.27.0 against /status.json 3.26.0 with 9213s of uptime. Reading the version from
          #     `/version` alone could call that converged and report a deploy that had not
          #     happened, against the very build it was replacing. Both must say the new version.
          #   * `loaded -ge 0` and `total -ge 0`, which is what this used to require of the
          #     catalogs and is true of every number this endpoint can emit -- `loaded=0` included.
          #     An assertion that cannot fail is not a check. The catalogs have to be LOADED, and
          #     none of them failed.
          #
          # Catalogs load asynchronously after the process is up (37 of them take a few minutes
          # from a cold start), so `pending` is expected to be non-zero for a while; the loop is
          # what waits for it, and 30 attempts at 20s is ~10 minutes of room.
          converged() { # 1=live 2=status_version 3=expected 4=loaded 5=total 6=failed 7=builder_ok
            [ -n "$1" ] && [ "$1" = "$3" ] || return 1
            [ -n "$2" ] && [ "$2" = "$3" ] || return 1
            [ "${5:--1}" -gt 0 ] && [ "${4:--1}" -eq "$5" ] || return 1
            [ "${6:--1}" -eq 0 ] || return 1
            [ "${7:-0}" -eq 1 ]
          }
          for i in $(seq 1 30); do
            version_json=$(curl -fsS -m 10 "${base}/version" 2>/dev/null || true)
            status_json=$(curl -fsS -m 10 "${base}/status.json" 2>/dev/null || true)
            live=$(printf '%s' "${version_json}" | tr -d ' \n' | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            status_version=$(printf '%s' "${status_json}" | jq -r '.version // ""' 2>/dev/null || echo "")
            loaded=$(printf '%s' "${status_json}" | jq -r '.catalogs.loaded // -1' 2>/dev/null || echo -1)
            total=$(printf '%s' "${status_json}" | jq -r '.catalogs.total // -1' 2>/dev/null || echo -1)
            failed=$(printf '%s' "${status_json}" | jq -r '.catalogs.failed // -1' 2>/dev/null || echo -1)
            builder_html=$(curl -fsS -m 10 "${base}/ui-builder/" 2>/dev/null || true)
            builder_mjs=$(curl -sS -o /dev/null -w '%{http_code}:%{content_type}' -m 10 "${base}/ui-builder/uiBuilder.mjs" 2>/dev/null || true)
            builder_wasm=$(curl -sS -o /dev/null -w '%{http_code}:%{content_type}' -m 10 "${base}/ui-builder/uiBuilder.wasm" 2>/dev/null || true)
            builder_ok=0
            case "${builder_html}:${builder_mjs}:${builder_wasm}" in
              *"<title>Compose UI Builder Preview</title>"*:200:text/javascript*:200:application/wasm*) builder_ok=1 ;;
            esac
            if converged "${live}" "${status_version}" "${{ steps.versions.outputs.server }}" \
              "${loaded}" "${total}" "${failed}" "${builder_ok}"; then
              {
                echo "deployed=true"
                echo "base_url=${base}"
                echo "ui_builder_url=${base}/ui-builder/"
                echo "catalogs_loaded=${loaded}"
                echo "catalogs_total=${total}"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "waiting for preview.coo.ee: version=${live:-?}/${status_version:-?} want ${{ steps.versions.outputs.server }}, catalogs=${loaded}/${total} failed=${failed}, ui-builder=${builder_ok} (attempt ${i}/30)"
            sleep 20
          done
          echo "::error::preview.coo.ee did not converge within ~10 min"
          exit 1
      - name: Comment the deploy milestone on the release PR
        if: ${{ steps.rollout.outputs.deployed == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_KEY: server-deployed
          MILESTONE_TAG: v${{ steps.versions.outputs.server }}
          BASE_URL: ${{ steps.rollout.outputs.base_url }}
          UI_BUILDER_URL: ${{ steps.rollout.outputs.ui_builder_url }}
          LOADED: ${{ steps.rollout.outputs.catalogs_loaded }}
          TOTAL: ${{ steps.rollout.outputs.catalogs_total }}
          V: ${{ steps.versions.outputs.server }}
        run: |
          md="$RUNNER_TEMP/deploy-milestone.md"
          {
            printf '### Server deployed — `%s` is running `%s`\n\n' "${BASE_URL#https://}" "${V}"
            printf -- '- Live version: [%s/version](%s/version)\n' "${BASE_URL}" "${BASE_URL}"
            printf -- '- UI builder preview: [%s](%s)\n' "${UI_BUILDER_URL}" "${UI_BUILDER_URL}"
            printf -- '- Catalogs: %s/%s loaded\n' "${LOADED}" "${TOTAL}"
            printf -- '- Image: `ghcr.io/%s/compose-preview-host:%s`\n' "${GITHUB_REPOSITORY_OWNER}" "${V}"
          } > "$md"
          MILESTONE_BODY="$(<"$md")" .github/scripts/comment-release-milestone.sh
      - name: Publish deployment config
        if: always() && steps.push.outcome == 'success'
        continue-on-error: true
        env:
          BASE_URL: ${{ vars.DEPLOY_BASE_URL || 'https://preview.coo.ee' }}
          DEPLOY_CONFIG_DIR: ${{ vars.DEPLOY_CONFIG_DIR || 'deploy/preview.coo.ee' }}
          ADMIN_TOKEN: ${{ secrets.SERVE_ADMIN_TOKEN }}
        run: |
          if [[ -z "${ADMIN_TOKEN}" ]]; then
            echo "SERVE_ADMIN_TOKEN is unset; skipping deployment config publish"
            exit 0
          fi
          # Same reconcile as publish-preview-config.yml and the same --prune, so an image roll
          # and a config push cannot leave the box in two different states.
          DEPLOY_CONFIG_DIR="$(cd "${DEPLOY_CONFIG_DIR}" && pwd)" \
            bash .github/scripts/publish-config-to-box.sh --prune
