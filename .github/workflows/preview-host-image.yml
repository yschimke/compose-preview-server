name: Publish preview-host image

on:
  workflow_dispatch:
    inputs:
      server_version:
        description: Released compose-preview-server version (leading v optional)
        required: true
      tools_version:
        description: Released compose-ai-tools version supplying lib-rcjvm and lib-bta
        required: true
      daemon_version:
        description: Released compose-preview-daemon version supplying the Android and desktop daemons
        required: true
  workflow_call:
    inputs:
      server_version:
        required: true
        type: string
      tools_version:
        required: true
        type: string
      daemon_version:
        required: true
        type: string
    secrets:
      DEPLOY_HOOK_TOKEN: {required: false}

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve versions
        id: versions
        env:
          RAW_SERVER: ${{ inputs.server_version }}
          RAW_TOOLS: ${{ inputs.tools_version }}
          RAW_DAEMON: ${{ inputs.daemon_version }}
        run: |
          server="${RAW_SERVER#v}"
          tools="${RAW_TOOLS#v}"
          daemon="${RAW_DAEMON#v}"
          test -n "${server}" || { echo "::error::server_version is empty"; exit 1; }
          test -n "${tools}" || { echo "::error::tools_version is empty"; exit 1; }
          test -n "${daemon}" || { echo "::error::daemon_version is empty"; exit 1; }
          echo "server=${server}" >> "$GITHUB_OUTPUT"
          echo "tools=${tools}" >> "$GITHUB_OUTPUT"
          echo "daemon=${daemon}" >> "$GITHUB_OUTPUT"
      - name: Prepare image context
        run: |
          mkdir -p deploy/image/release-assets deploy/image/scripts
          touch deploy/image/release-assets/.keep
          cp scripts/install-linux-font-fallbacks.sh deploy/image/scripts/
      - name: Wait for the standalone distribution
        env:
          V: ${{ steps.versions.outputs.server }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${V}/compose-preview-server-${V}.tar.gz"
          for i in $(seq 1 20); do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' -r 0-0 "$url" || true)
            if [ "$code" = 200 ] || [ "$code" = 206 ]; then exit 0; fi
            echo "waiting for server ${V} distribution (attempt ${i}/20)"
            sleep 30
          done
          echo "::error::standalone distribution is not resolvable: ${url}"
          exit 1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/compose-preview-host
          tags: |
            type=raw,value=${{ steps.versions.outputs.server }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: deploy/image
          file: deploy/image/Dockerfile
          build-args: |
            SERVER_VERSION=${{ steps.versions.outputs.server }}
            TOOLS_VERSION=${{ steps.versions.outputs.tools }}
            DAEMON_VERSION=${{ steps.versions.outputs.daemon }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # OPT-IN: notify an operator's deploy hook (deploy/image/deploy-hook.sh, routed by the edge at
      # /__hooks/rollout) and wait for that host to serve the image just pushed. Inert unless the
      # repository sets the `DEPLOY_HOOK_URL` variable and the `DEPLOY_HOOK_TOKEN` secret, so a fork
      # or a repository with no deployment of its own only builds and publishes. `DEPLOY_WRITER` set
      # to anything but `public` also skips it, for a host whose rollout another repository drives.
      - name: Notify the deploy hook and verify rollout
        id: rollout
        if: ${{ vars.DEPLOY_HOOK_URL != '' }}
        env:
          HOOK_URL: ${{ vars.DEPLOY_HOOK_URL }}
          HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
          DEPLOY_WRITER: ${{ vars.DEPLOY_WRITER }}
          EXPECTED: ${{ steps.versions.outputs.server }}
        run: |
          if [[ -n "${DEPLOY_WRITER}" && "${DEPLOY_WRITER}" != public ]]; then
            echo "::notice::DEPLOY_WRITER=${DEPLOY_WRITER}; another writer owns the host, skipping rollout notification"
            exit 0
          fi
          if [[ -z "${HOOK_TOKEN}" ]]; then
            echo "DEPLOY_HOOK_TOKEN is unset; skipping rollout notification"
            exit 0
          fi
          hook_body="$(mktemp)"
          code=$(curl -sS -o "${hook_body}" -w '%{http_code}' -m 30 \
            -X POST -H "Authorization: Bearer ${HOOK_TOKEN}" "${HOOK_URL}" 2>/dev/null || echo 000)
          case "${code}" in
            200|202) ;;
            *)
              # The hook refuses with this body only when the host's compose project does not load.
              # The poller runs the same project and fails the same way, so waiting would only
              # spend the whole convergence window; anything else (a 502 while the hook restarts,
              # a timeout) may still be picked up by the poller.
              if grep -q 'compose project does not load' "${hook_body}"; then
                echo "::error::deploy hook refused the rollout: $(head -c 2000 "${hook_body}")"
                exit 1
              fi
              echo "::warning::deploy hook returned ${code}; waiting for the host's poller"
              ;;
          esac
          base="${HOOK_URL%/__hooks/rollout}"
          # CONVERGED, as a function, so `.github/scripts/test-preview-host-rollout.sh` can extract
          # and exercise it without a network. What it rejects is the reason it exists:
          #
          #   * A SPLIT during the swap. Two containers answer the host while the new one takes
          #     over, so `/version` can report the new build in the same second that
          #     `/status.json` reports the old one. Reading the version from one endpoint alone
          #     could call that converged against the very build it was replacing. Both must say
          #     the new version.
          #   * An empty fleet. `loaded -ge 0` is true of every number the endpoint can emit, so the
          #     catalogs have to be LOADED (at least one, all of them), and none of them failed.
          #
          # Catalogs load asynchronously after the process is up, so `pending` is expected to be
          # non-zero for a while; the loop is what waits for it, and 30 attempts at 20s is ~10
          # minutes of room.
          converged() { # 1=live 2=status_version 3=expected 4=loaded 5=total 6=failed
            [ -n "$1" ] && [ "$1" = "$3" ] || return 1
            [ -n "$2" ] && [ "$2" = "$3" ] || return 1
            [ "${5:--1}" -gt 0 ] && [ "${4:--1}" -eq "$5" ] || return 1
            [ "${6:--1}" -eq 0 ]
          }
          for i in $(seq 1 30); do
            version_json=$(curl -fsS -m 10 "${base}/version" 2>/dev/null || true)
            status_json=$(curl -fsS -m 10 "${base}/status.json" 2>/dev/null || true)
            live=$(printf '%s' "${version_json}" | tr -d ' \n' | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            status_version=$(printf '%s' "${status_json}" | jq -r '.version // ""' 2>/dev/null || echo "")
            # `loaded` and `failed` mean what `/status.json` means by them: a stale catalog still
            # serves, and only one with nothing to serve has failed.
            loaded=$(printf '%s' "${status_json}" | jq -r \
              '[.catalogList[] | select(.loadState == "loaded" or .loadState == "stale")] | length' \
              2>/dev/null || echo -1)
            total=$(printf '%s' "${status_json}" | jq -r '.catalogList | length' 2>/dev/null || echo -1)
            failed=$(printf '%s' "${status_json}" | jq -r \
              '[.catalogList[] | select(.loadState == "failed")] | length' 2>/dev/null || echo -1)
            if converged "${live}" "${status_version}" "${EXPECTED}" "${loaded}" "${total}" "${failed}"; then
              {
                echo "deployed=true"
                echo "base_url=${base}"
                echo "ui_builder_url=${base}/ui-builder/"
                echo "catalogs_loaded=${loaded}"
                echo "catalogs_total=${total}"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "waiting for ${base}: version=${live:-?}/${status_version:-?} want ${EXPECTED}, catalogs=${loaded}/${total} failed=${failed} (attempt ${i}/30)"
            sleep 20
          done
          echo "::error::${base} did not converge within ~10 min"
          exit 1
      - name: Comment the deploy milestone on the release PR
        if: ${{ steps.rollout.outputs.deployed == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_KEY: server-deployed
          MILESTONE_TAG: v${{ steps.versions.outputs.server }}
          BASE_URL: ${{ steps.rollout.outputs.base_url }}
          UI_BUILDER_URL: ${{ steps.rollout.outputs.ui_builder_url }}
          LOADED: ${{ steps.rollout.outputs.catalogs_loaded }}
          TOTAL: ${{ steps.rollout.outputs.catalogs_total }}
          V: ${{ steps.versions.outputs.server }}
        run: |
          md="$RUNNER_TEMP/deploy-milestone.md"
          {
            printf '### Server deployed — `%s` is running `%s`\n\n' "${BASE_URL#https://}" "${V}"
            printf -- '- Live version: [%s/version](%s/version)\n' "${BASE_URL}" "${BASE_URL}"
            printf -- '- UI builder preview: [%s](%s)\n' "${UI_BUILDER_URL}" "${UI_BUILDER_URL}"
            printf -- '- Catalogs: %s/%s loaded\n' "${LOADED}" "${TOTAL}"
            printf -- '- Image: `ghcr.io/%s/compose-preview-host:%s`\n' "${GITHUB_REPOSITORY_OWNER}" "${V}"
          } > "$md"
          MILESTONE_BODY="$(<"$md")" .github/scripts/comment-release-milestone.sh
