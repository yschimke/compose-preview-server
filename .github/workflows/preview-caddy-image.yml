# Build and publish the baked-Caddyfile reverse-proxy image to GHCR.
#
# Pairs with deploy/image/caddy.Dockerfile + docker-compose.yml: a host running the stack
# runs `ghcr.io/<owner>/compose-preview-caddy:latest` instead of `caddy:2` + a
# bind-mounted Caddyfile, so a Caddyfile change auto-deploys through the SAME
# Watchtower path as the preview server (Watchtower watches image digests, not the
# mounted file). Pushing a new `:latest` digest here is what makes Watchtower
# recreate the caddy container on the host with the new config.
#
# Triggers on a Caddyfile / caddy.Dockerfile change on main (so the published
# image never lags the repo), plus manual dispatch.
#
# GHCR NOTE: `compose-preview-caddy` is a package created by compose-ai-tools, so its
# Actions write access is scoped to that repository. This one needs Write on it
# (Package settings -> Manage Actions access) or the push fails with
# `denied: permission_denied: write_package` — exactly how compose-preview-host's
# first release from here failed.
name: Publish preview-caddy image

on:
  push:
    branches: [main]
    paths:
      - deploy/image/Caddyfile
      - deploy/image/caddy.Dockerfile
      # The entrypoint that resolves SITE_DOMAINS from the deployment's catalogs.json, and the
      # scanner it calls. Baked into the image like the Caddyfile, so a change to either has to
      # publish a new one or a host keeps running the old edge config.
      - deploy/image/caddy-entrypoint.sh
      - deploy/image/site-domains.sh
      - .github/workflows/preview-caddy-image.yml
  # Validate (never publish) the edge config on a pull request: `latest` rolls onto the live box
  # automatically, and a Caddyfile that fails to parse takes every hostname on it down.
  pull_request:
    paths:
      - deploy/image/Caddyfile
      - deploy/image/caddy.Dockerfile
      # The entrypoint that resolves SITE_DOMAINS from the deployment's catalogs.json, and the
      # scanner it calls. Baked into the image like the Caddyfile, so a change to either has to
      # publish a new one or a host keeps running the old edge config.
      - deploy/image/caddy-entrypoint.sh
      - deploy/image/site-domains.sh
      - .github/workflows/preview-caddy-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image locally
        run: docker build -f deploy/image/caddy.Dockerfile -t compose-preview-caddy:validate deploy/image

      # `caddy validate` through the image's own entrypoint, so the generated `/start` routes and
      # SITE_DOMAINS are part of what is parsed. Each case is a configuration a deployment can run.
      - name: caddy validate
        run: |
          set -euo pipefail
          validate() {
            echo "::group::validate $*"
            docker run --rm -e DOMAIN=preview.example.com "$@" compose-preview-caddy:validate \
              validate --config /etc/caddy/Caddyfile --adapter caddyfile
            echo "::endgroup::"
          }
          validate
          validate -e START_SITE_URL=https://yschimke.github.io/compose-ai-tools/
          validate -e SERVE_UI_BUILDER_HOST=ui.example.com \
            -e START_SITE_URL=https://yschimke.github.io/compose-ai-tools/ \
            -e UI_BUILDER_START_SITE_URL=https://yschimke.github.io/compose-ui-builder/
          validate -e SERVE_UI_BUILDER_HOST=ui.example.com -e SITE_DOMAINS=m3.preview.example.com

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/compose-preview-caddy
          # `latest` is what the box tracks (Watchtower rolls on its digest); the
          # `sha-<commit>` tag lets an operator pin a specific config via CADDY_IMAGE_TAG.
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/image
          file: deploy/image/caddy.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
