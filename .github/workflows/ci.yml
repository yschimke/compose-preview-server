name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - run: ./gradlew check ktfmtCheckAll :server:distTar
      - name: Smoke-test standalone distribution
        run: |
          mkdir -p "${RUNNER_TEMP}/compose-preview-server"
          tar -xzf server/build/distributions/*.tar.gz -C "${RUNNER_TEMP}/compose-preview-server"
          "${RUNNER_TEMP}"/compose-preview-server/*/bin/compose-preview-server --help

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify deployment scripts
        run: |
          # Both directories: the box's own scripts live in deploy/image/, and the reconcile that
          # publishes config TO a box lives in .github/scripts/. Its self-test was referenced by
          # name in its header long before it existed, which is how the prune diff went untested.
          for test_script in deploy/image/test-*.sh .github/scripts/test-*.sh; do
            [ -f "${test_script}" ] || continue
            echo "::group::${test_script}"
            bash "${test_script}"
            echo "::endgroup::"
          done

  serve-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: serve-web/package-lock.json
      - run: npm ci
        working-directory: serve-web
      - run: npm run format:check
        working-directory: serve-web
      - run: npm run verify
        working-directory: serve-web

  visual-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: preview-harness/package-lock.json
      - run: npm ci
        working-directory: preview-harness
      - run: npx playwright install --with-deps chromium
        working-directory: preview-harness
      - run: npm run harness:pages
        working-directory: preview-harness
      - run: npm run harness:compare
        working-directory: preview-harness
