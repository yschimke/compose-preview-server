name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # For `Regenerate goldens`, which pushes a fixture refresh onto a pull request branch with
  # GITHUB_TOKEN. Such a push deliberately raises neither `push` nor `pull_request`, so without a
  # way to ask for CI by name the commit it makes would carry no checks at all.
  workflow_dispatch:

permissions:
  contents: read

# The UI builder is a separate repository (yschimke/compose-ui-builder). The default build resolves
# its four seams as RELEASES -- three from Maven Central, the editor archive from that repository's
# GitHub release -- so `gradle` needs no checkout and CI proves the published set resolves.
#
# The visual harness serves the builder's four Wasm distributions -- the editor, the renderer and
# the two Jetcaster fixtures -- from the SAME release, downloaded by
# `preview-harness/fetch-ui-builder-dists.sh` rather than built, so it too tests the pinned set.
# The one job that still builds from a checkout is `ui-builder-remote-compose`, for the flag no
# release enables.

# A pull request cancels its own superseded runs; a push to `main` does not cancel anything.
#
# `${{ github.ref }}` alone puts every push to `main` in ONE group, so each merge cancelled the
# previous commit's run. On a fast merge train that means commits reach `main` with no completed
# CI at all — four times on 2026-09-06 alone (runs 1179, 1182, 1191, 1193). It is how
# yschimke/compose-preview-server#448 and #450 both landed untested against each other: each was
# green alone, their combination was never run, and the breakage surfaced two PRs later on #447,
# which had nothing to do with either.
#
# So a push takes `github.run_id` — unique per run, therefore a group of one, therefore never
# cancelled. A pull request keeps `github.ref`, where cancelling IS right: only the newest push to a
# branch is worth testing. Same shape `no-agent-attribution.yml` already uses, and the same reason
# `release.yml` gives a merged release PR its own slot.
#
# This does NOT prevent two PRs that are each green alone from conflicting once merged — that needs
# every PR to be up to date with `main` before it merges, which is a ruleset setting rather than
# anything a workflow file can express. What it does guarantee is that `main` always ends up with a
# verdict, so such a conflict is reported against the commit that introduced it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The UI builder is a second project in this repository (docs/design/UI_BUILDER_PROJECT_BOUNDARY.md).
  # Its own job rather than a step in `gradle`: the check reads build files and needs no JDK, no
  # Gradle and no cache, so it answers in seconds and says which boundary broke rather than being
  # the twelfth line of a build log.
  # Was `ui-builder-boundary`, when the UI builder was a second project in this repository and a
  # text scan kept the two apart. The modules are yschimke/compose-ui-builder now, so the boundary
  # is a repository boundary and `ui-builder-project-boundary.sh` is gone: a module cannot join the
  # wrong project when the projects are different repositories. `wear-port-canvas-only.sh` went
  # with the modules it scans and runs in that repository's CI.
  source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tools-owned parser vendor
        run: python3 .github/scripts/check-usage-source-psi-vendor.py
      # The design-render lane's manifest and its sticky comment. Pure stdlib and no image is
      # opened — a design render is compared by the sha256 the manifest carries — so this belongs
      # in the job that needs no JDK rather than in `gradle`.
      - name: Design render lane tests
        run: python3 .github/scripts/test_design_renders.py
      - run: python3 scripts/local-dependencies/test_stage.py
      # The catalog names, which shrink to nothing over phases 4 and 5. Scoped to `:server` now;
      # the builder modules' half of the rule went with them.
      - run: .github/scripts/ui-builder-catalog-literals.sh

  # `gradle` was one serial chain: configuration, `:server:compileKotlin`, `compileTestKotlin`,
  # then ~4.5 minutes of `:server:test` with nothing else left to run beside it -- 11-12 minutes
  # in all, the longest job in the workflow. `:server:test` now has a runner of its own, where it
  # takes every core (`-Pcomposeai.testForks`), and `gradle-build` runs the rest of `check`
  # without it. `gradle` stays as the check the ruleset requires, and Renovate's automerge waits
  # on, and passes only if both did; see the note on `visual-harness` for why a gate must run
  # whatever its `needs` did rather than be skipped.
  gradle-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Two JDKs, because this build has two JVM floors: `java-server` (17) for everything a
          # consumer compiles against, and `java-ui-builder` (21) for the UI-builder frontend lane.
          # See the top of `gradle/libs.versions.toml`. 17 is last, so it is `JAVA_HOME` and Gradle
          # itself runs on the floor the distribution ships for; the 21 install is reached as a
          # toolchain through `org.gradle.java.installations.fromEnv` in `gradle.properties`, which
          # names the `JAVA_HOME_<version>_<arch>` variables this action exports.
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - run: ./gradlew check ktfmtCheckAll :server:distTar :mcp:distTar -x :server:test
      - name: Smoke-test standalone distribution
        run: |
          mkdir -p "${RUNNER_TEMP}/compose-preview-server"
          tar -xzf server/build/distributions/*.tar.gz -C "${RUNNER_TEMP}/compose-preview-server"
          dist_root=$(find "${RUNNER_TEMP}/compose-preview-server" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -f "${dist_root}/wasm-ui/index.html"
          test -f "${dist_root}/ui-builder/index.html"
          test -f "${dist_root}/ui-builder/uiBuilder.mjs"
          test -f "${dist_root}/ui-builder/uiBuilder.wasm"
          # The component record the Compose export generates from. Absent, a packaged host
          # advertises no Compose export at all and the builder withdraws the action — which is
          # what every deployed box did while this file sat in the repository unshipped.
          test -f "${dist_root}/ui-builder-components/m3-catalog-components-v1.json"
          "${dist_root}/bin/compose-preview-server" --help

  gradle-server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Two JDKs, because this build has two JVM floors: `java-server` (17) for everything a
          # consumer compiles against, and `java-ui-builder` (21) for the UI-builder frontend lane.
          # See the top of `gradle/libs.versions.toml`. 17 is last, so it is `JAVA_HOME` and Gradle
          # itself runs on the floor the distribution ships for; the 21 install is reached as a
          # toolchain through `org.gradle.java.installations.fromEnv` in `gradle.properties`, which
          # names the `JAVA_HOME_<version>_<arch>` variables this action exports.
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          # Same key as `gradle-build`, which is the job that writes it.
          cache-read-only: true
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - run: ./gradlew :server:test -Pcomposeai.testForks=4

  gradle:
    needs: [gradle-build, gradle-server-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every split Gradle job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A Gradle job did not succeed: ${NEEDS}"
          exit 1
        env:
          NEEDS: ${{ toJSON(needs.*.result) }}

  ui-builder-remote-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ONE job that still builds the UI builder from a checkout, and it is the flag that makes
      # it necessary rather than convenience. `uiBuilderRemoteCompose` reaches the
      # `UiBuilderBuildFeatures` object inside `:ui-builder-export`, and the released jar carries
      # whatever that object was built with — `false`, because no release enables the flag. A
      # released coordinate therefore cannot be asked to switch the server's remote-compose routes
      # on, which is exactly what this lane exists to test, so it takes the checkout and the
      # substitution (`-PcomposeUiBuilderDir`) and the global property reaches the included build.
      # It is also the only CI coverage of that opt-in path.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            17
      # BEFORE the UI-builder checkout, deliberately. The basic provider keys the cache on a hash of
      # every Gradle build file in the workspace, and with the checkout already in place that hash
      # took in the UI builder's files too -- a key no `main` run had ever saved, since the builder
      # moves independently (its release bumps alone change it), so this job restored nothing and
      # resolved every dependency cold. Restored first, the key is `gradle-build`'s, which `main`
      # does save. Read-only so this job, holding a different build's state, never writes that key.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      # At the release this repository pins, not the builder's `main`. The lane tests the flag on
      # the builder the server ships with; against `main` it went red on every builder change a
      # server test had not caught up with yet (a new catalog component, a rule-selection change),
      # which nothing here could fix until the next bump. A builder change reaches this lane on
      # that bump, the same pull request that adopts it.
      - name: Read the pinned UI-builder release
        id: ui-builder-pin
        run: |
          version="$(sed -n 's/^composeai-ui-builder = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          test -n "$version"
          echo "ref=v$version" >> "$GITHUB_OUTPUT"
      - name: Check out the UI builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-ui-builder
          ref: ${{ steps.ui-builder-pin.outputs.ref }}
          path: .compose-ui-builder
          persist-credentials: false
      # The normal Gradle job proves the shipping default. Keep the opt-in code compiled and
      # exercised as well, without enabling it in distributions.
      # The UI-builder half of this lane (`:ui-builder-export:jvmTest`, `:ui-builder:jvmTest`,
      # `:ui-builder-runtime:test`, `:ui-builder:compileKotlinWasmJs`) runs in
      # yschimke/compose-ui-builder's CI under the same flag. A release pairs the two: the flag is
      # one compile-time choice made in two builds now, and they have to agree.
      - run: >-
          ./gradlew -PcomposeUiBuilderDir=.compose-ui-builder -PuiBuilderRemoteCompose=true
          -Pcomposeai.testForks=4 :mcp:test :server:test

  selector-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The consumer half of the preview-selector pin (compose-ai-tools#5185). `PreviewSelectorFixturesTest`
      # runs the vendored table through this server's rule on every `check`; this step is the other
      # question — whether the vendored copy is still the one the pinned compose-ai-tools release
      # ships. It goes red on a pin bump that changed the table, which is when the obligation to
      # re-sync becomes real, and no-ops while the pinned release predates the file.
      - name: Check vendored preview-selector fixtures
        run: ./scripts/sync-preview-selector-fixtures.sh --check

      # The evidence pruner deletes directories, so its keep-rules are what stand between a
      # scheduled job and somebody's baseline. The age floor especially: it is the only thing keeping
      # an open PR's evidence, and it cannot be checked by reading the tree.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Evidence pruner tests
        run: node --test scripts/prune-evidence.test.mjs

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify analytics bootstrap
        run: |
          python3 deploy/analytics/test-bootstrap.py
          bash -n deploy/analytics/setup.sh deploy/analytics/backup.sh
          UMAMI_DB_PASSWORD=test UMAMI_APP_SECRET=test UMAMI_TWO_FACTOR_KEY=test docker compose -f deploy/analytics/docker-compose.yml config --quiet
      - name: Verify deployment scripts
        run: |
          # Both directories: the box's own scripts live in deploy/image/, and the reconcile that
          # publishes config TO a box lives in .github/scripts/. Its self-test was referenced by
          # name in its header long before it existed, which is how the prune diff went untested.
          for test_script in deploy/image/test-*.sh .github/scripts/test-*.sh; do
            [ -f "${test_script}" ] || continue
            echo "::group::${test_script}"
            bash "${test_script}"
            echo "::endgroup::"
          done

  serve-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: serve-web/package-lock.json
      - run: npm ci
        working-directory: serve-web
      - run: npm run format:check
        working-directory: serve-web
      - run: npm run verify
        working-directory: serve-web

  ui-builder-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: npm test
        working-directory: scripts/ui-builder
      # The readiness gate's own tests. They existed for several rounds and nothing ran them, which
      # is the failure the gate itself is about: a check nobody invokes is indistinguishable from a
      # check that passes. The gate is what the cutover PR turns `--strict` on against, so a
      # regression in it would be discovered by the cutover.
      - run: .github/scripts/test-ui-builder-equivalence.sh
      # And the gate itself, against the catalog pair it is for. Its own comment above says a
      # check nobody invokes is indistinguishable from a check that passes, and until now only
      # the SELF-TEST ran: no catalog-level fact of a real published catalog was compared to the
      # frozen one by anything. `remote-m3` is the first pair generated by a real
      # `composePreviewDiscover`, so it is the first that can be gated this way.
      #
      # `--strict` from the start. Every difference is in the reviewed list beside it with a
      # reason, including the one that is a blocker rather than a decision (`remote-m3/lottie`
      # cannot be offered) — recorded so the gate can be strict while the loss stays asserted,
      # component by component, in PublishedRemoteM3CatalogEquivalenceTest.
      - name: remote-m3 catalog-level equivalence
        run: |
          .github/scripts/ui-builder-equivalence.sh \
            --policy docs/design/fixtures/ui-builder/remote-m3-published-v1.json \
            --golden docs/design/fixtures/ui-builder/remote-m3-capabilities-v1.json \
            --differences docs/design/fixtures/ui-builder/remote-m3-differences.json \
            --catalog-id remote-m3 \
            --component-id-prefix "remote-m3/" \
            --strict

      # And m3, whose pair is generated the same way. It is NOT the same comparison: the frozen
      # m3-catalog document is a hand transcription of the packaged Jetcaster catalog, unrelated
      # to yschimke/m3-catalog, so the contract says a byte-equal result would be the surprising
      # outcome and the reviewed difference list is the deliverable. `--strict` anyway — the point
      # of the list is that every entry pins the catalog value AND the frozen value it was read
      # against, so it fails when either side moves.
      # And wear-m3, the third and last catalog whose published pair is generated by a real
      # `composePreviewDiscover`. `--strict` from the start, like the two above, and for the same
      # reason: the 53 fields the frozen catalog has no opinion about are ADDITIONS, but additions
      # are exactly where a catalog-side collision hides. Two of the ones read here are recorded as
      # wrong rather than blessed -- `app-scaffold` and `time-text` sit on the Horologist
      # `Fast scrolling` shelf, which is a file-level `@file:CatalogGroup` collision and not intent
      # (see their entries in wear-m3-differences.json). Every acceptance pins the value it was read
      # against, so a re-shelving fails here instead of passing quietly.
      - name: wear-m3 catalog-level equivalence
        run: |
          .github/scripts/ui-builder-equivalence.sh \
            --policy docs/design/fixtures/ui-builder/wear-m3-published-v1.json \
            --golden docs/design/fixtures/ui-builder/wear-m3-capabilities-v1.json \
            --differences docs/design/fixtures/ui-builder/wear-m3-differences.json \
            --catalog-id wear-m3 \
            --component-id-prefix "wear-m3/" \
            --strict

      - name: m3 catalog-level equivalence
        run: |
          .github/scripts/ui-builder-equivalence.sh \
            --policy docs/design/fixtures/ui-builder/m3-catalog-generated-published-v1.json \
            --golden docs/design/fixtures/ui-builder/m3-catalog-capabilities-v1.json \
            --differences docs/design/fixtures/ui-builder/m3-catalog-differences.json \
            --catalog-id m3-catalog \
            --component-id-prefix "m3/" \
            --strict

  # The visual harness, as three jobs. It used to be a single job that linked four UI-builder Wasm
  # distributions one after another from a checkout (~20 min before the first test); those now
  # come from the pinned release (`fetch-ui-builder-dists.sh`), the server distribution builds from
  # the restored cache, and the page captures, which need no build output at all, start at once.

  # `:server:installDist`, beside the page captures. Read-only cache: the key is
  # `gradle-build`'s (same build files), and this job must never be the one that writes it -- an
  # entry holding only what `installDist` resolves would leave `check` a cold start on every PR.
  visual-harness-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - run: ./gradlew :server:installDist
      # Tarred so the launcher keeps its executable bit; an artifact does not carry modes.
      - run: tar -czf "${RUNNER_TEMP}/server.tgz" server/build/install
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-harness-server
          path: ${{ runner.temp }}/server.tgz
          retention-days: 1
          compression-level: 0

  # The served viewer's pages, the compare scorer and the `.rc` viewer: static fixtures in this
  # repository behind `_server.mjs`, and no build output at all, so they need not wait for one.
  # The longest of the harnesses (~5 min of the old job's 7.5), now off the critical path.
  visual-harness-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: preview-harness/package-lock.json
      - run: npm ci
        working-directory: preview-harness
      # See `visual-harness` for why these two source lists go first.
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
      - run: npx playwright install --with-deps chromium
        working-directory: preview-harness
      - run: npm run harness:pages
        working-directory: preview-harness
      - run: npm run harness:compare
        working-directory: preview-harness
      - run: npm run harness:rc-viewer
        working-directory: preview-harness
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: visual-harness-pages-results
          path: preview-harness/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Also the verdict for the whole lane, because `visual-harness` is the name a ruleset requires. A
  # job whose `needs` failed is SKIPPED, and GitHub counts a skipped required check as passing, so
  # a failed build or page capture would otherwise merge. It therefore waits on both split jobs
  # (`-pages` included, about a minute longer than `-server`; the lane still finishes inside
  # `gradle-build`'s time), runs whatever they did, and fails first thing unless both succeeded.
  visual-harness:
    needs: [visual-harness-server, visual-harness-pages]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      # The harness server resolves `/ui-builder/...` and the renderer routes against this
      # directory, laid out like a builder checkout by `fetch-ui-builder-dists.sh`.
      COMPOSE_UI_BUILDER_DIR: ${{ github.workspace }}/.compose-ui-builder
    steps:
      - name: Every split visual-harness job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A visual-harness job did not succeed: ${NEEDS}"
          exit 1
        env:
          NEEDS: ${{ toJSON(needs.*.result) }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: preview-harness/package-lock.json
      # The harness servers run on 21; nothing here builds any more. The UI builder's renderer is
      # `java-ui-builder` (21) -- its previews are compiled for 21 and unpacked into a daemon that
      # runs on the server's own JVM -- so on 17 `ServeUiBuilderRenderPort`'s preflight withdraws
      # PNG/SVG export and the gate fails with "catalog does not support PNG export". Exactly as
      # `deploy/image/Dockerfile` already does by running on Temurin 21.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21.0.12+8.0.LTS
      - run: npm ci
        working-directory: preview-harness
      # `--with-deps` runs `apt-get update`, which reads every source list on the runner image —
      # including the two third-party repositories this job installs nothing from. Google's served a
      # `Packages.gz` whose hash did not match its own `Release` file, `apt-get update` exited 100,
      # and the browser install failed before a single test ran (#659). Dropping those lists makes
      # that class of failure impossible rather than unlikely: every dependency Playwright asks for
      # comes from the Ubuntu archives, and nothing here installs Chrome or the Microsoft packages.
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
      - run: npx playwright install --with-deps chromium
        working-directory: preview-harness
      - name: Download the UI-builder distributions
        run: preview-harness/fetch-ui-builder-dists.sh "${COMPOSE_UI_BUILDER_DIR}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: visual-harness-server
          path: ${{ runner.temp }}/server
      - name: Unpack the server distribution
        run: |
          tar -xzf "${RUNNER_TEMP}/server/server.tgz"
          test -x server/build/install/compose-preview-server/bin/compose-preview-server
      - run: npm run harness:ui-builder
        working-directory: preview-harness
      - run: npm run harness:ui-builder-jetcaster
        working-directory: preview-harness
      - run: npm run harness:ui-builder-renderer
        working-directory: preview-harness
      - run: npm run harness:ui-builder-visual-replay
        working-directory: preview-harness
      - run: npm run harness:ui-builder-performance
        working-directory: preview-harness
      - run: npm run harness:ui-builder-design-url
        working-directory: preview-harness
      # Playwright writes `<name>-actual.png` and `<name>-diff.png` next to every snapshot it
      # rejects, and until now the job threw them away. That is why a deliberate render change can
      # leave a baseline stale indefinitely: the only platform that gates these snapshots is this
      # runner, so the bytes needed to refresh one were never obtainable from a failing run --
      # #788's three Jetcaster failures sat red across ten merges for exactly that reason.
      # `!cancelled()` rather than `failure()` so a run that goes green still shows what it
      # compared, and `if-no-files-found: ignore` because a fully green run writes nothing here.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: visual-harness-results
          path: preview-harness/test-results/
          if-no-files-found: ignore
          retention-days: 14
