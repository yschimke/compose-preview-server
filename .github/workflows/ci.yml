name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-provider: basic
      - run: ./gradlew check ktfmtCheckAll

  serve-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: serve-web/package-lock.json
      - run: npm ci
        working-directory: serve-web
      - run: npm run format:check
        working-directory: serve-web
      - run: npm run verify
        working-directory: serve-web

  visual-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: preview-harness/package-lock.json
      - run: npm ci
        working-directory: preview-harness
      - run: npx playwright install --with-deps chromium
        working-directory: preview-harness
      - run: npm run harness:pages
        working-directory: preview-harness
      - run: npm run harness:compare
        working-directory: preview-harness
