name: Publish preview deployment config

on:
  push:
    branches: [main]
    paths:
      - deploy/preview.coo.ee/catalogs.json
      - deploy/preview.coo.ee/producers.json
      - deploy/preview.coo.ee/settings.json
      # The reconcile itself. A change to HOW config is applied is as much a reason to re-apply it
      # as a change to the config: #75 taught this script to retire catalogs the committed file no
      # longer declares, and without this line that landed on main and did nothing, because the
      # only paths that trigger a publish are the two data files it had not touched. The box went
      # on serving three entries #69 had already deleted from catalogs.json, which is the exact
      # drift --prune exists to end.
      - .github/scripts/publish-config-to-box.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-preview-deployment-config
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Long enough for the restart a config change can owe: a forced zero-downtime rollout boots and
    # readiness-checks a fresh replica (up to the rollout's 300s health timeout) before the old one
    # drains, and the publish then reads the box until it serves the new config.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reconcile deployment config
        env:
          BASE_URL: ${{ vars.DEPLOY_BASE_URL || 'https://preview.coo.ee' }}
          DEPLOY_CONFIG_DIR: ${{ vars.DEPLOY_CONFIG_DIR || 'deploy/preview.coo.ee' }}
          ADMIN_TOKEN: ${{ secrets.SERVE_ADMIN_TOKEN }}
          # The deploy hook's token, the same one the image publish uses for /__hooks/rollout. When a
          # PUT answers restartRequired, the publish POSTs /__hooks/restart with it so the config
          # serves without anyone SSHing in. Unset ⇒ the config is written and applies at the next
          # image roll, with a warning.
          DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
          DEPLOY_HOOK_RESTART_URL: ${{ vars.DEPLOY_HOOK_RESTART_URL || 'https://preview.coo.ee/__hooks/restart' }}
        run: |
          test -n "${ADMIN_TOKEN}" || { echo "::error::SERVE_ADMIN_TOKEN is required"; exit 1; }
          # --prune: this file is the whole answer for this box, so a catalog dropped from it is
          # retired rather than left serving. Registry-contributed catalogs are exempt by
          # construction — see the script header.
          DEPLOY_CONFIG_DIR="$(cd "${DEPLOY_CONFIG_DIR}" && pwd)" \
            bash .github/scripts/publish-config-to-box.sh --prune
