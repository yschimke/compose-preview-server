# editor measure the same way. `androidx-window` and `composeai-contracts` are unchanged again.
# 3.76.0 moves with compose-ai-tools 2.32.2 / compose-preview-daemon 3.13.0 above
# (compose-ui-builder#412), so the builder and this server resolve one daemon line. Its editor adds
# custom typefaces — any Google Fonts family, and theme typefaces per role group
# (compose-ui-builder#408), which this server serves by name since #1296 — a searchable font picker
# (compose-ui-builder#411), and mobile/offline web: insets, Web Share, IndexedDB and the
# `ui-builder-sw.js` service worker at the archive root (compose-ui-builder#410) that #1300 already
# serves at `/ui-builder/ui-builder-sw.js`. `androidx-window` and `composeai-contracts` are unchanged.
# 3.77.0 exports a themed m3/surface's theme — colours, type scale, corner radius and typefaces —
# which the server's screen export resolves through `Outcome.Projected.resolvable` (compose-ui-builder#413).
# 3.78.0 adds a theme host's `themeTextStyle`, the role unstyled text is set in, which the screen
# export provides as `ProvideTextStyle` inside the theme (compose-ui-builder#416).
# 3.79.0 draws a design's typefaces in the renderer's thumbnails and PNG/SVG exports, from the
# Google Fonts cache this server names on its daemon (compose-ui-builder#425).
# 3.80.0 lets the editor resize a live catalog runtime frame instead of rebooting it on every
# height change (compose-ui-builder#438), grows a runtime-drawn frame when its layout changes after
# the first frame (compose-ui-builder#430), and draws theme typefaces in device previews
# (compose-ui-builder#434).
# 3.87.0 offers `remote-m3/remote-icon` on the widget palette and exports it as `RemoteIcon` from a
# Material icon key (compose-ui-builder#497), so it leaves the published shelf's export refusals.
# 3.88.0 frames Wear widgets only in the predefined host shapes, ignoring a legacy padding or radius
# override rather than drawing or refusing it (compose-ui-builder#501), which
# RecordFreeComposeExportTest now expects.
# It also adds `PackagedUiBuilderRenderBundle.digest()`, the identity of the PNG render pipeline,
# which keys the designs page's thumbnail cache beside the server version (compose-ui-builder#502).
# And it owns `PublishedUiBuilderCatalog`, the composer of a catalog's published `ui-builder.json`
# with its component record (compose-ui-builder#503), which this server called its own copy of;
# its tests went with it, so they no longer pin that repository's behaviour from here.
# 3.91.0 is built on contracts 3.20.0: its screen projection refuses a `remoteCall` by name (the
# root refusal DesignModifierExportTest expects), and it adds variable-font axes and OpenType
# features to every design system's text (compose-ui-builder#521).
# 3.94.0 previews a launcher widget (`remote-widgets`) on the launcher grid: fixed cell-count panes
# and one resizable by a handle that animates in whole cells (compose-ui-builder#567), and draws
# the launcher root and its button labels on the canvas. `androidx-window` and `composeai-contracts`
# are unchanged.
# 3.95.0 adds CatalogCutoverShadow, the report a shadowed catalog's `uiBuilder.catalogs.<id>.shadow`
# logs and serves (compose-ui-builder#583), asks a Wear widget only the widget guideline rules and a
# screen only the screen ones (#574), and records `m3/variable-font-text` at export (#581).
# `androidx-window` and `composeai-contracts` are unchanged.
composeai-ui-builder = "3.96.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
ktor = "3.6.0"
# The Model Context Protocol Kotlin SDK, behind `:mcp`. Same version compose-ai-tools' `:mcp` was
# on when the module moved here (compose-ai-tools#5176) — a move is not the moment to also change
# the protocol implementation.
mcp-kotlin-sdk = "0.15.0"
# JUnit 4 + Truth, used only by `:mcp`'s tests, which came with the module. Converting ~1.5k lines
# of assertions to `kotlin.test` is a separate change from moving them.
junit = "4.13.2"
truth = "1.4.5"
okhttp = "5.5.0"
okio = "3.18.2"
classgraph = "4.8.196"
jmdns = "3.6.3"

[libraries]
composeai-common-web-escaping = { module = "ee.schimke.composeai:common-web-escaping" }
# The render host, the bundle daemon and the git-backed preview history. Was this repository's own
# `:render-host` module, published as `compose-preview-render-host`, until yschimke/compose-preview-server#180
# moved it to the repository that owns everything it depends on. It has no web server and never did;
# it lived here only because it was written inside the `serve` package and came along when the server
# was extracted. Same version ref as the rest of compose-ai-tools, because it now ships on that line.
composeai-render-host = { module = "ee.schimke.composeai:render-host" }
# The Remote Compose JSON codec: authoring JSON -> `.rc` bytes, and `.rc` bytes -> the
# operation-level document JSON the viewer's `GET /render/<id>.rc.json` lane serves. Layer 1 by
# `REPOSITORY_LAYERS.md`'s test (behaviour, opens no socket), consumed here as a published
# coordinate like `render-matrix` — this server never inflates a document any other way, so there is
# exactly one `remote-core` on the classpath and no split-family skew for `RemoteComposePairing` to
# report. Runs on a plain JVM: `remote-core` and `remote-creation-core` are `java-library`
# publications, so nothing Android reaches this server through them.
composeai-remotecompose-json = { module = "ee.schimke.composeai:remotecompose-json" }
# The wire contract this server speaks to a `compose-preview build-host --stdio` process, so it can
# ask for local Gradle work without linking the Gradle Tooling API. Shape and framing only — that is
# what lets `checkServeModuleBoundary` keep holding while the server gains the capability
# yschimke/compose-preview-server#9 asked for.
composeai-build-host-protocol = { module = "ee.schimke.composeai:build-host-protocol" }
# The upstream BOMs. THE only `ee.schimke.composeai` entries in this file that carry a
# version: every coordinate below deliberately carries none of its own. (`compose-preview-ui-builder-web`
# is the one non-BOM entry with a version, and the UI-builder ref above says why.)
#
# The rule the daemon line arrived at now holds for every line. Each of those repositories publishes
# only the modules a release changes -- compose-preview-daemon#123, and since then
# compose-ai-tools#5485, compose-preview-contracts#80, rc-players#196 and the UI builder's own
# reduced releases -- so their coordinates no longer all sit at the same version. Pinning a line's
# modules to one shared ref, which this catalog used to do for three of the five, resolves until
# that line's first reduced release and then fails on whichever module did not publish at the new
# version. It is not a slow failure either: it arrives the first time a release skips a module this
# repository names.
#
# A BOM is the published record of which versions belong together, so it is the only thing that
# should name one. It also answers the question the shared ref was really being asked: given this
# release, what version is each of its modules at? Only the publisher can answer that now.
#
# Consuming modules import them as platforms. `docs/design/PREVIEW_SERVER_SPLIT.md` requires these
# to resolve by coordinate from a repository rather than from an included build, so a BOM that is
# missing from Central is a build failure here rather than something silently satisfied locally.
# The UI-builder entry is opt-in the other way round -- `-PcomposeUiBuilderDir` is the only way
# a checkout is consulted, and the default build proves the published set resolves.
composeai-tools-bom = { module = "ee.schimke.composeai:compose-ai-tools-bom", version.ref = "composeai-tools" }
composeai-contracts-bom = { module = "ee.schimke.composeai:compose-preview-contracts-bom", version.ref = "composeai-contracts" }
composeai-daemon-bom = { module = "ee.schimke.composeai:compose-preview-daemon-bom", version.ref = "composeai-preview-daemon" }
composeai-ui-builder-bom = { module = "ee.schimke.composeai:compose-preview-ui-builder-bom", version.ref = "composeai-ui-builder" }
composeai-preview-data-api = { module = "ee.schimke.composeai:preview-data-api" }
composeai-preview-discovery = { module = "ee.schimke.composeai:preview-discovery" }
# `screen-model` is the generator compiled for wasmJs as well as the JVM, which is what lets the
# browser editor reach the same `ScreenGenerator` the server exports with.
composeai-screen-model = { module = "ee.schimke.composeai:screen-model" }
composeai-common-image-crop = { module = "ee.schimke.composeai:common-image-crop" }
composeai-bundle-format = { module = "ee.schimke.composeai:bundle-format" }
composeai-bundle-coordinates = { module = "ee.schimke.composeai:bundle-coordinates" }
composeai-daemon-core = { module = "ee.schimke.composeai:daemon-core" }
composeai-daemon-client = { module = "ee.schimke.composeai:daemon-client" }
composeai-render-session-api = { module = "ee.schimke.composeai:render-session-api" }
composeai-render-session-subprocess = { module = "ee.schimke.composeai:render-session-subprocess" }
# Render-matrix axis expansion and contact-sheet composition, shared by the CLI's `render-matrix`
# command and `:mcp`'s `render_matrix` tool. Lifted out of compose-ai-tools' `:mcp` before the
# module moved here, precisely so the offline CLI command did not have to follow it (#5188 there).
composeai-render-matrix = { module = "ee.schimke.composeai:render-matrix" }
composeai-data-pseudolocale-core = { module = "ee.schimke.composeai:data-pseudolocale-core" }
composeai-data-remotecompose-core = { module = "ee.schimke.composeai:data-remotecompose-core" }
# Slot marker/host API shared by JVM and Wasm catalogs. The daemon repository owns and publishes
# both variants; this server consumes the release instead of compiling a second copy.
composeai-slot-preview-runtime = { module = "ee.schimke.composeai:slot-preview-runtime" }

composeai-agent-grant-protocol = { module = "ee.schimke.composeai:agent-grant-protocol" }
composeai-parity-issues-protocol = { module = "ee.schimke.composeai:parity-issues-protocol" }
composeai-common-io = { module = "ee.schimke.composeai:common-io" }
composeai-data-layoutinspector-core = { module = "ee.schimke.composeai:data-layoutinspector-core" }
composeai-data-theme-core = { module = "ee.schimke.composeai:data-theme-core" }
composeai-data-preview-overrides-core = { module = "ee.schimke.composeai:data-preview-overrides-core" }
composeai-data-preview-overrides-runtime = { module = "ee.schimke.composeai:data-preview-overrides-runtime" }
composeai-data-render-core = { module = "ee.schimke.composeai:data-render-core" }
composeai-ui-builder-protocol = { module = "ee.schimke.composeai:ui-builder-protocol" }
composeai-ui-builder-runtime = { module = "ee.schimke.composeai:compose-preview-ui-builder-runtime" }
composeai-ui-builder-export = { module = "ee.schimke.composeai:compose-preview-ui-builder-export" }
# The editor archive, and the only coordinate here resolved from a GitHub release rather than from
