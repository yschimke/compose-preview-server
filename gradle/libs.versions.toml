[versions]
# The two JVM floors this repository maintains, and the line between them.
#
# `java-server` is the floor of everything a *consumer* compiles or resolves against: `:server`,
# `:mcp`, `:usage-source-psi`, and — published from yschimke/compose-ui-builder — the UI-builder
# runtime and export. It is 17 because `compose-ai-tools` pins every JVM module to a 17 toolchain
# and its `:cli` compiles its tests against the released server, so class file 65 anywhere in that
# graph fails their build outright with "class file has wrong version 65.0, should be 61.0". That
# repository has ruled out moving while AGP and Robolectric target 17, so this number does not move
# on our schedule. `:server:checkServerJvmFloor` proves nothing above it reaches the distribution.
#
# `java-ui-builder` is the floor of the UI-builder *frontend* JVM lane — `:ui-builder` and
# `:ui-builder-artwork`, which live in yschimke/compose-ui-builder now — whose class files are
# published to nobody. They ship only inside `:ui-builder-render-bundle`'s polyglot PNG, as opaque
# bytes a render daemon unpacks; no consumer ever puts them on a compile classpath. That is what
# lets that lane sit above the line, and it is the seam yschimke/compose-preview-server#346 built
# when it moved the bundle out of the published runtime jar. The cost is a *runtime* one and it is
# real: the daemon that renders that bundle runs under the server's own JVM (`java.home`), so a
# self-hoster on 17 loses UI-builder PNG/SVG export. The bundle therefore carries this number as
# data and `ServeUiBuilderRenderPort` preflights it, so that lands as one sentence naming both
# versions rather than an `UnsupportedClassVersionError` from a daemon nobody knew existed
# (yschimke/compose-preview-server#344). Nothing in THIS build compiles at 21 except the
# `visual-harness` lane's UI-builder checkout, which is built by that repository's own wrapper.
java-server = "17"
java-ui-builder = "21"
kotlin = "2.4.20"
ktfmt = "0.27.0"
ktfmt-cli = "0.64"
compose-multiplatform = "1.12.1"
# Material 3 adaptive, for the real `SupportingPaneScaffold` on the editor's canvas and preview
# panes. Its own version line rather than the Compose Multiplatform one, which is why it is a
# separate ref: the adaptive artifacts ship independently of the CMP bundle.
compose-material3-adaptive = "1.2.0"
# Wear Compose Material 3 / Foundation, compiled for Compose Multiplatform. `androidx.wear.compose`
# publishes an Android AAR and nothing else — its Gradle module metadata carries exactly two
# variants, both `releaseVariantRelease*Publication` — so the canvas cannot link the real library.
# This port is that library's source built for `jvm` and `wasmJs`, keeping the
# `androidx.wear.compose.material3` package names, and it is what the canvas draws.
#
# Version-locked to the CATALOG's ref, not floated: `yschimke/wear-m3-catalog` pins the same
# `1.7.0-beta02-cmp09` for `:catalog-desktop`, and the two drifting would mean the canvas and the
# kit rendition disagreeing about a component for a reason no render could explain.
wearcmp-port = "1.7.0-beta02-cmp09"
# `androidx.window`, as the JetBrains multiplatform port publishes it. Nothing in this build depends
# on it directly — it arrives transitively under the adaptive artifacts above — and this ref exists
# so the server's RENDERER SIDECAR can carry the same library onto the daemon's parent class loader.
# `server/build.gradle.kts` says why that is necessary; it is the fix for
# yschimke/compose-preview-server#812.
#
# So the number to hold it at is whatever the adaptive artifacts resolve, NOT the newest published:
# the sidecar copy is the one the render links against, so a higher one here would silently swap the
# library out from under the bundle. That agreement used to be checked in this build
# (`:ui-builder:checkWindowSidecarVersion`); it is enforced in yschimke/compose-ui-builder now, and
# this repository's half of the rule is to move this ref only alongside `composeai-ui-builder`.
androidx-window = "1.4.0"
material-icons-extended = "1.7.3"
graphics-shapes = "1.1.0"
# One ref for every compose-ai-tools coordinate, and for the Gradle plugin id it also drives.
# 1.80.0 is the first release carrying `render-matrix`, which `:mcp` needs, and the daemon-core /
# render-session-api surface the moved MCP sources compile against. The pin moved with the module
# (compose-ai-tools#5176) rather than in a Renovate bump, because the module cannot build below it.
#
# `preview-discovery` and `screen-model` were pinned apart while the release carrying
# `ScreenGenerator` ran ahead of the plugin/renderer floor this build resolved, so bumping the
# shared ref would have forced a plugin and renderer bump into the same change. That floor caught
# up at 1.80.0 — the three refs met — so the split is gone rather than left reading as a live
# constraint. Split them again only if the floor falls behind a coordinate this build needs.
#
# 1.82.0 is a floor rather than a bump: `ScreenDocumentProjection` emits `ChainLink
# .receiverScopeFqn` and `ScreenValue.Fractional32`, which is how a layout weight became
# expressible (compose-ai-tools#5212), and neither exists below it.
#
# 2.0.0 is not a breaking bump. compose-ai-tools#5229 adopted minor-only versioning and cut 2.0.0
# as the last major it will ever publish, so the number changed and the API did not. The move is
# here rather than in a Renovate bump because the new `EnvironmentFieldV1.EXPORT_DEVICES` makes
# three `when` expressions in `PersistentUiBuilderService` non-exhaustive, so the bump and the
# field's handling are one change. `screen-model` also first carries `ScreenGenerator.Preview
# .screenSizes` here. 2.1.0 is the first release carrying `ScreenGenerator.Preview.devices`
# (compose-ai-tools#5248), which is what turns a design's export-device set into one
# `@Preview(device = …)` per id rather than a multipreview that discards which devices it named.
# 2.13.0 stops the CLI consuming this server's Maven jar and installs the newest release instead
# (compose-ai-tools#5436); 2.13.1 is the design-pages kit guard (m3-catalog#398). Bumped by hand
# rather than waiting for Renovate because the preview-host image resolves `tools_version` from
# this line at release time, so the image ships whatever it says when 3.28.0 is cut.
#
# 2.17.0 is required by the daemon bump below, not optional alongside it. `render-host` carries
# `ServeDesignPageStore`, and 2.15.0 was compiled against `preview-data-api` 3.4.x, whose
# `DesignPage` is a seven-field data class. Daemon 3.5.0 added `layers` and the two `PageBlendMode`
# fields, so the `copy$default` signature `render-host` 2.15.0 calls no longer exists and every
# design-page test dies with `NoSuchMethodError` at `ServeDesignPages.kt:158`. 2.17.0 is compiled
# against `preview-data-api` 3.5.0 and so is binary-compatible with 3.6.0. The tools line and the
# daemon line are a matched set across this boundary; move them together.
#
# 2.18.1 is the first release publishing `compose-ai-tools-bom`, which is why this line stops being
# named by any coordinate below. (2.18.0 exists as a tag and a GitHub Release and is NOT on Central:
# its publish job died in configuration. Do not pin it.)
composeai-tools = "2.22.0"
# The render daemons, the renderers, the preview annotations and data API, and the data extractors,
# published from yschimke/compose-preview-daemon since its 3.0.0 (compose-ai-tools#5336). Layer 1a
# in that repository's `docs/design/REPOSITORY_LAYERS.md`: between the contracts and
# compose-ai-tools, on a release line of its own — so `daemon-core`, `daemon-client`,
# `preview-data-api`, `renderer-desktop`, `daemon-desktop` and the `data-*` runtimes below no
# longer move with `composeai-tools`. (`composeai-data`, the tools repository's separately-versioned
# data line, went with the move.) A point pin, for the same reason as the two above.
#
# 3.4.5 carries the fix for the live lane's `previewOverrideChoice` crash
# (compose-preview-server#839, compose-preview-daemon#99): the JVM `PreviewOverrideOption` is an
# `actual typealias` onto `ee.schimke.composeai.data.overrides.`, a package the daemon's
# `mustDelegateToParent` did not pin to the parent loader, so on the bundle-backed Android lane the
# option resolved child-first out of the bundle jar while the overrides runtime resolved to the
# Robolectric sandbox copy — `ClassCastException: PreviewOverrideOption cannot be cast to
# PreviewOverrideOption`. Any catalog shipping an option-bearing knob hit it; nothing here changes
# but the pin. 3.4.4 rides along (contracts 2.18.0, third-party-rc-embedded-player 1.61.1).
# 3.4.8 makes Glimmer Live start in touch mode, matching snapshots and physical devices, then enter
# keyboard/focus mode only when pointer movement establishes gaze (compose-preview-daemon#111).
#
# 3.6.1 because 3.6.0's GITHUB RELEASE is a permanently empty draft, and this repository needs both
# of a daemon release's channels, not one. Maven Central carries 3.6.0 fine -- the BOM and all
# seventy coordinates resolve -- so Gradle never noticed. The preview-host image is what noticed:
# its Dockerfile fetches `compose-preview-desktop-daemon-<version>.tar.gz` from
# `releases/download/v<version>/`, which 404s for 3.6.0, and `--retry-all-errors` then spends ten
# minutes retrying a 404 that cannot succeed before failing the build. That is what killed this
# repository's v3.36.0 release and left preview.coo.ee unable to roll ANY new image.
#
# 3.6.0 will not heal: it is tagged, so its release cannot be re-cut, and its sidecars were never
# attached (compose-preview-daemon#127 -- a `publish-maven` that uploaded to Central and then failed
# on a protected-branch push, taking the `release` job with it). Moving forward is the only repair.
#
# 3.6.1 is verified on BOTH channels, which is the check this bump exists to make:
#   * GitHub assets -- `compose-preview-desktop-daemon-3.6.1.tar.gz` (72.6 MB) and
#     `compose-preview-android-daemon-3.6.1.zip` (248.9 MB), both present.
#   * Maven Central -- the BOM pins all 70 coordinates at 3.6.1, a full publish with no gaps.
#
# NOT 3.7.0, which is published with its assets but whose Central sync had not landed when this was
# written: every coordinate, the BOM included, still 404s there. Bumping to it would trade a broken
# image build for a broken Gradle resolve. Renovate can take this line to 3.7.0 once Central catches
# up, by which point it is a routine bump rather than the one unblocking a restart loop.
#
# 3.6.1 is also the release that restores the contract's unknown-enum rule. 3.5.0 shipped
# `coerceInputValues` on `DesignPagesJson` (compose-preview-daemon#119), and that flag is Json-wide
# rather than per-field, so it disabled the rule for EVERY enum the contract carries -- blend modes
# included, where reinterpreting an unrecognised value composites a layer the reader believes is
# authored. compose-preview-daemon#128 reverted it. ServeDesignPageStoreTest's "an unknown link
# method" case is the assertion that states the rule, and it tracks this pin: on 3.6.0 it must
# assert the degrade, on 3.6.1 the drop.
#
# 3.8.0 puts the design-pages wire types behind builders: the constructors are `internal` and
# `@ConsistentCopyVisibility` takes the generated `copy` with them, so neither can be the signature
# a released consumer loses when a field is added upstream. That is the same break this pin's own
# history records twice over, from the other side. Construction here moves to
# `Type.Builder(...).build()` and derivation to `newBuilder()`, exactly as contracts 3.0.0 did in
# #910; `ServeDesignPageStoreTest`'s unknown-enum case still asserts the drop.
composeai-preview-daemon = "3.8.3"
# 2.9.0 is the first release carrying `DesignEnvironmentV1.exportDevices` and its Set/Reset
# changes, which is the field a design names its export devices in. 2.14.0 adds the components a
# design defines — `DesignDocumentV1.components`, `DesignNodeV1.component` and the `binding` value
# that reads the dictionary in scope (compose-preview-contracts#57) — which is the wire behind the
# component placements and loop rows this repository's canvas and exporter already draw from its
# own document model.
# 3.1.0 is the first release publishing `compose-preview-contracts-bom`. 3.3.0 adds the optional
# `WasmCapabilityV1.canvas` adapter id, so a published catalog can carry `frame/round-screen` to the
# renderer instead of leaving the server to reduce that declaration to status prose. 3.4.0 owns the
# catalog-renderer runtime manifest, validation and canonical tree-integrity framing. 3.5.0 adds
# Browser Preview renderer selection and canvas-only vocabulary projections. 3.7.0 lets a catalog
# declare the safe, versioned Compose source adapter a host resolves for source export. 3.9.0 keeps
# runtime manifest v1 strict and introduces v2 for implementation provenance.
composeai-contracts = "3.9.0"

# The extracted UI builder (yschimke/compose-ui-builder), resolved from its RELEASES. Three jars
# and a BOM on Maven Central, and the editor archive as a GitHub release asset reached through the
# fenced ivy repository in `settings.gradle.kts`. This ref is what the default build resolves;
# `-PcomposeUiBuilderDir` swaps all four seams for a checkout of that repository instead.
#
# The BOM names the three jars, for the reason every other composeai line here uses one: each
# release publishes only the modules it changed, so a shared ref across them resolves until the
# first reduced release and then fails on whichever module did not publish. The web archive is the
# exception that still carries a version of its own -- it is deliberately not in the BOM, because
# it is not a Maven module, and a BOM entry for a coordinate nobody uploaded is exactly the
# failure this catalog's own history records.
# 3.29.0 replaces protocol data-class `copy` calls in the runtime with the contracts line's stable
# builders. Required with contracts 3.3.0: the added optional fields intentionally change generated
# copy signatures, while `newBuilder()` remains binary-compatible. 3.32.0 adds protocol-v2 surface
# handling to the bundled editor while retaining protocol v1, matching catalog runtime staging.
# 3.33.0 adds exact-pin catalog recovery for designs whose stored catalog is no longer served.
# 3.39.0 ships the catalog-declared Compose source-export adapter registry consumed by this server.
# 3.42.0 accepts protocol-v2 catalog runtime manifests in the browser editor while retaining v1.
# 3.43.0 moves the export projection to `ee.schimke.composeai.uibuilder.export`
# (compose-ui-builder#168); the imports here follow it, so this pin and those imports move together.
# 3.44.0 offers the Remote Material 3 components on the widget palette and writes them from an
# embedded record (compose-ui-builder#202, #207); no API this server calls changed.
# 3.45.0 adds the remote-m3 vocabulary for those components (compose-ui-builder#214), which is what
# `RemoteM3VocabularyParityTest` holds 3.44.0 to, plus the Figma bridge and the experimental adaptive
# Wear widget container; no API this server calls changed.
# 3.46.0 lets a pinned catalog runtime show through the editor canvas, which drew blank for every
# remote-m3 design (compose-ui-builder#221), and imports the RemoteBox an empty widget's native
# preview draws (compose-ui-builder#220); no API this server calls changed.
# 3.47.0 tells a catalog runtime which widget host shape each preview pane is, so the Samsung and
# Pixel Watch panes frame in their own shapes (compose-ui-builder#225), and groups the editor home
# screen's recent designs by folder (compose-ui-builder#223); no API this server calls changed.
# 3.48.0 places the catalog runtime canvas in CSS pixels, so a remote-m3 widget no longer sits
# offset from its frame on a devicePixelRatio 2 display, draws published `remote-m3/remote-text` in
# PNG exports (compose-ui-builder#232), and makes the Google app samples lay out and export
# (compose-ui-builder#230), whose newly written components the m3 export tests here now count.
# 3.49.0 inlines the pictures the editor has fetched into the document it posts a catalog runtime,
# so remote-m3 designs draw their photos on the canvas instead of an `asset/image` placeholder, and
# re-maps the runtime's inspection snapshot on canvas zoom, so the selection overlay no longer drifts
# off the design (compose-ui-builder#240); no API this server calls changed.
composeai-ui-builder = "3.49.0"
# 1.65.0 is the first release publishing `rc-players-bom`. (1.64.0 is a tag and a GitHub Release
# whose Maven coordinates never reached Central -- rc-players#211 -- so it cannot be pinned.)
# 1.67.0 by hand, ahead of Renovate's soak: it pins the KMP player modules to a Java 17 toolchain
# (rc-players#272), the floor every consumer of this repository resolves at.
rc-players = "1.70.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
ktor = "3.6.0"
# The Model Context Protocol Kotlin SDK, behind `:mcp`. Same version compose-ai-tools' `:mcp` was
# on when the module moved here (compose-ai-tools#5176) — a move is not the moment to also change
# the protocol implementation.
mcp-kotlin-sdk = "0.15.0"
# JUnit 4 + Truth, used only by `:mcp`'s tests, which came with the module. Converting ~1.5k lines
# of assertions to `kotlin.test` is a separate change from moving them.
junit = "4.13.2"
truth = "1.4.5"
okhttp = "5.5.0"
okio = "3.18.2"
classgraph = "4.8.196"
jmdns = "3.6.3"

[libraries]
composeai-common-web-escaping = { module = "ee.schimke.composeai:common-web-escaping" }
# The render host, the bundle daemon and the git-backed preview history. Was this repository's own
# `:render-host` module, published as `compose-preview-render-host`, until yschimke/compose-preview-server#180
# moved it to the repository that owns everything it depends on. It has no web server and never did;
# it lived here only because it was written inside the `serve` package and came along when the server
# was extracted. Same version ref as the rest of compose-ai-tools, because it now ships on that line.
composeai-render-host = { module = "ee.schimke.composeai:render-host" }
# The Remote Compose JSON codec: authoring JSON -> `.rc` bytes, and `.rc` bytes -> the
# operation-level document JSON the viewer's `GET /render/<id>.rc.json` lane serves. Layer 1 by
# `REPOSITORY_LAYERS.md`'s test (behaviour, opens no socket), consumed here as a published
# coordinate like `render-matrix` — this server never inflates a document any other way, so there is
# exactly one `remote-core` on the classpath and no split-family skew for `RemoteComposePairing` to
# report. Runs on a plain JVM: `remote-core` and `remote-creation-core` are `java-library`
# publications, so nothing Android reaches this server through them.
composeai-remotecompose-json = { module = "ee.schimke.composeai:remotecompose-json" }
# The wire contract this server speaks to a `compose-preview build-host --stdio` process, so it can
# ask for local Gradle work without linking the Gradle Tooling API. Shape and framing only — that is
# what lets `checkServeModuleBoundary` keep holding while the server gains the capability
# yschimke/compose-preview-server#9 asked for.
composeai-build-host-protocol = { module = "ee.schimke.composeai:build-host-protocol" }
# The five upstream BOMs. THE only `ee.schimke.composeai` entries in this file that carry a
# version: every coordinate below deliberately carries none of its own. (`compose-preview-ui-builder-web`
# is the one non-BOM entry with a version, and the UI-builder ref above says why.)
#
# The rule the daemon line arrived at now holds for all five. Each of those repositories publishes
# only the modules a release changes -- compose-preview-daemon#123, and since then
# compose-ai-tools#5485, compose-preview-contracts#80, rc-players#196 and the UI builder's own
# reduced releases -- so their coordinates no longer all sit at the same version. Pinning a line's
# modules to one shared ref, which this catalog used to do for three of the five, resolves until
# that line's first reduced release and then fails on whichever module did not publish at the new
# version. It is not a slow failure either: it arrives the first time a release skips a module this
# repository names.
#
# A BOM is the published record of which versions belong together, so it is the only thing that
# should name one. It also answers the question the shared ref was really being asked: given this
# release, what version is each of its modules at? Only the publisher can answer that now.
#
# Consuming modules import them as platforms. `docs/design/PREVIEW_SERVER_SPLIT.md` requires these
# to resolve by coordinate from a repository rather than from an included build, so a BOM that is
# missing from Central is a build failure here rather than something silently satisfied locally.
# The UI-builder entry is opt-in the other way round -- `-PcomposeUiBuilderDir` is the only way
# a checkout is consulted, and the default build proves the published set resolves.
composeai-tools-bom = { module = "ee.schimke.composeai:compose-ai-tools-bom", version.ref = "composeai-tools" }
composeai-contracts-bom = { module = "ee.schimke.composeai:compose-preview-contracts-bom", version.ref = "composeai-contracts" }
composeai-daemon-bom = { module = "ee.schimke.composeai:compose-preview-daemon-bom", version.ref = "composeai-preview-daemon" }
composeai-rc-players-bom = { module = "ee.schimke.composeai:rc-players-bom", version.ref = "rc-players" }
composeai-ui-builder-bom = { module = "ee.schimke.composeai:compose-preview-ui-builder-bom", version.ref = "composeai-ui-builder" }
composeai-preview-data-api = { module = "ee.schimke.composeai:preview-data-api" }
composeai-preview-discovery = { module = "ee.schimke.composeai:preview-discovery" }
# `screen-model` is the generator compiled for wasmJs as well as the JVM, which is what lets the
# browser editor reach the same `ScreenGenerator` the server exports with.
composeai-screen-model = { module = "ee.schimke.composeai:screen-model" }
composeai-common-image-crop = { module = "ee.schimke.composeai:common-image-crop" }
composeai-bundle-format = { module = "ee.schimke.composeai:bundle-format" }
composeai-bundle-coordinates = { module = "ee.schimke.composeai:bundle-coordinates" }
composeai-daemon-core = { module = "ee.schimke.composeai:daemon-core" }
composeai-daemon-client = { module = "ee.schimke.composeai:daemon-client" }
composeai-render-session-api = { module = "ee.schimke.composeai:render-session-api" }
composeai-render-session-subprocess = { module = "ee.schimke.composeai:render-session-subprocess" }
