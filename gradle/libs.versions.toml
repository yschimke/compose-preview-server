# 3.52.0 passes a Wear `AppCard` its content lambda when the card has no body, so the
# `google-home-wear` design compiles in `design render --local` instead of being refused
# (compose-ui-builder#271); no API this server calls changed.
# 3.53.0 names every argument of the supporting-pane scaffold's `calculateThreePaneScaffoldValue`,
# which adaptive-layout 1.3 (the m3 catalog bundle's) no longer defaults, so the Calendar and Gmail
# samples compile in `design render --local` (compose-ui-builder#273); no API this server calls
# changed.
# 3.54.0 adds the public-design grant (`UiBuilderPublicAccess`), `ListRevisions` and
# `RestoreRevision`, which `--ui-builder-default-visibility` and the history page call, and the
