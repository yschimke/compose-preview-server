# First published version of the optional publication server library (Maven Central).
livery = "0.22.0"
# Packages a design revision's WFF source into the signed APK the real watch-face runtime loads
# (`DwfPackaging`), from yschimke/watchface-tools; published to Maven Central since 0.3.0. 0.3.2 is
# the first that targets Java 17 (watchface-tools#28), which this build's floor needs. `wff-core`
# (the bundle layout, compiled against here) is released only when it changes, so it has its own
# pin: 0.3.1 is what the packager 0.3.2 requires and what the builder is on. The packager is deliberately NOT on any classpath of the server:
# Google's `validator-push` brings `xercesImpl` (the XSD 1.1 build, which the WFF schema needs), and
# a second JAXP implementation on the server's classpath replaces the JDK's for every DOM user in
# the process (it made `ExplodedSvg` return its input unexploded). It ships as `lib-wff-packager/`
# and runs in its own JVM. Needs the Android SDK's aapt2 and zipalign plus a platform android.jar at
# run time, never at build time.
# 0.9.0 adds `validate --report-out` (the per-check report `watchface-validation` serves) and
# `wff-apk`, whose `WffEstimate` is the SDK-free cost estimate returned after each MCP edit of a
# watch face (`WatchFaceCostEstimator`). `wff-apk` is on the server's classpath: pure Kotlin over
# `wff-core`, with none of the packager's validator jars.
# 0.11.0 moves all three together (0.10.0 published no libraries): `wff-apk` 0.11.0 needs
# `wff-core` 0.11.0 at run time, so the core pin follows it.
wff-packager = "0.12.1"
wff-apk = "0.12.1"
wff-core = "0.12.1"
# The Android Remote Compose players the server's own player-only Android daemon replays documents
# with, staged as `lib-rc-players-android/` (`stageRcPlayersAndroidLibs`). The Android daemon
# sidecar deliberately ships none of this family (a consumer brings it, compose-preview-daemon's
# `isConsumerSuppliedRemoteCompose`), so a daemon with no catalog behind it has to be handed one.
# `rc-players-android` is the rc-players release (its BOM) the daemon's connector is built against,
# and `compose-remote` is the AndroidX line that release's embedded player depends on; move them
# together. The same BOM picks the CMP player (`rc-player-compose`) staged beside them for
# `cmp-android`, and pins its JVM target staged as `lib-rc-player-desktop/` for the desktop player
# daemon (`stageRcPlayerDesktopLibs`); compose-preview-daemon's desktop binding is compiled against
# this release's `rc-player-compose`. The CMP/Wasm player's browser bundle (`rc-player-wasm` below)
# comes from the same release, so it moves with this ref too.
rc-players-android = "2.33.0"
compose-remote = "1.0.0-alpha24"
# The TypeScript player's browser bundle (`remote-compose-player-js-dist`, a zip with the `dist`
# classifier). Its own ref because rc-players publishes only the modules a release changed: the
# bundle last changed in 2.1.2, and 2.1.3–2.4.0 never published this coordinate.
remote-compose-player-js = "2.33.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.13.0"
ktor = "3.6.1"
