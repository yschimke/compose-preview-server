composeai-data-remotecompose-core = { module = "ee.schimke.composeai:data-remotecompose-core" }
# Slot marker/host API shared by JVM and Wasm catalogs. The daemon repository owns and publishes
# both variants; this server consumes the release instead of compiling a second copy.
composeai-slot-preview-runtime = { module = "ee.schimke.composeai:slot-preview-runtime" }

composeai-agent-grant-protocol = { module = "ee.schimke.composeai:agent-grant-protocol" }
composeai-parity-issues-protocol = { module = "ee.schimke.composeai:parity-issues-protocol" }
composeai-common-io = { module = "ee.schimke.composeai:common-io" }
composeai-data-layoutinspector-core = { module = "ee.schimke.composeai:data-layoutinspector-core" }
composeai-data-theme-core = { module = "ee.schimke.composeai:data-theme-core" }
composeai-data-preview-overrides-core = { module = "ee.schimke.composeai:data-preview-overrides-core" }
composeai-data-preview-overrides-runtime = { module = "ee.schimke.composeai:data-preview-overrides-runtime" }
composeai-data-render-core = { module = "ee.schimke.composeai:data-render-core" }
composeai-ui-builder-protocol = { module = "ee.schimke.composeai:ui-builder-protocol" }
composeai-ui-builder-runtime = { module = "ee.schimke.composeai:compose-preview-ui-builder-runtime" }
composeai-ui-builder-export = { module = "ee.schimke.composeai:compose-preview-ui-builder-export" }
# The editor archive, the render bundle and the export's variable fonts: three of the four
# coordinates here resolved from a GitHub release rather than from Central (`rc-player-wasm` below
# is the other). They carry the UI-builder version themselves because the BOM, which only names what
# is on Central, no longer does. `@zip` for the archive at the use site; the two jars are the
# ivy repository's default extension.
composeai-ui-builder-web = { module = "ee.schimke.composeai:compose-preview-ui-builder-web", version.ref = "composeai-ui-builder" }
composeai-ui-builder-render-bundle = { module = "ee.schimke.composeai:compose-preview-ui-builder-render-bundle", version.ref = "composeai-ui-builder" }
composeai-ui-builder-export-fonts = { module = "ee.schimke.composeai:compose-preview-ui-builder-export-fonts", version.ref = "composeai-ui-builder" }
# The CMP/Wasm Remote Compose player: the `rc-player-wasm.zip` asset on the yschimke/rc-players
# release, through the `rcPlayerWasmRelease` ivy repository (settings.gradle.kts), not Central.
# Shipped in the server tarball as `rc-player-wasm/`, which the image's entrypoint passes as
# `--rc-player-wasm-dir`: that serves `/rc-player-wasm/`, enables the viewer's `cmp-wasm` lane, and
# offers the CMP player beside the TypeScript one on a `/d/<id>` page. `@zip` at the use site, like
# the editor archive. Versioned by the rc-players BOM's ref so Renovate still moves it: a Central
# lookup of this coordinate finds nothing, and a ref of its own would never be bumped.
rc-player-wasm = { module = "ee.schimke.composeai:rc-player-wasm", version.ref = "rc-players-android" }
# Artifact-only at the use site (`dist` classifier, `zip`): the coordinate is a static bundle, not a
# library, and only its zip is wanted.
remote-compose-player-js-dist = { module = "ee.schimke.composeai:remote-compose-player-js-dist", version.ref = "remote-compose-player-js" }

# Artifact-only at the use site and non-transitive: `lib-rc-players-android/` is exactly the family the
# Android sidecar leaves out, and everything else those players link comes from the sidecar.
compose-remote-core = { module = "androidx.compose.remote:remote-core", version.ref = "compose-remote" }
compose-remote-creation = { module = "androidx.compose.remote:remote-creation", version.ref = "compose-remote" }
compose-remote-creation-core = { module = "androidx.compose.remote:remote-creation-core", version.ref = "compose-remote" }
compose-remote-creation-compose = { module = "androidx.compose.remote:remote-creation-compose", version.ref = "compose-remote" }
compose-remote-player-core = { module = "androidx.compose.remote:remote-player-core", version.ref = "compose-remote" }
compose-remote-player-view = { module = "androidx.compose.remote:remote-player-view", version.ref = "compose-remote" }
compose-remote-player-compose = { module = "androidx.compose.remote:remote-player-compose", version.ref = "compose-remote" }
# Versionless, through the rc-players BOM: rc-players publishes only the modules a release changed.
rcplayer-embedded-android = { module = "ee.schimke.composeai:third-party-rc-embedded-player" }
# The CMP player behind `cmp-android` and, as its JVM target, the server's own desktop player daemon
# (the cmp-jvm held session, staged as `lib-rc-player-desktop/`). Transitive at its use sites
# (`rcPlayersAndroidCmp`, `stageRcPlayerDesktopLibs`), unlike the family above: its runtime tail is
# not the sidecar's. Versionless, through the same rc-players BOM.
rcplayer-compose = { module = "ee.schimke.composeai:rc-player-compose" }
