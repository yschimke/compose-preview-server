composeai-tools = "2.103.0"
# The render daemons, the renderers, the preview annotations and data API, and the data extractors,
# published from yschimke/compose-preview-daemon since its 3.0.0 (compose-ai-tools#5336). Layer 1a
# in that repository's `docs/design/REPOSITORY_LAYERS.md`: between the contracts and
# compose-ai-tools, on a release line of its own — so `daemon-core`, `daemon-client`,
# `preview-data-api`, `renderer-desktop`, `daemon-desktop` and the `data-*` runtimes below no
# longer move with `composeai-tools`. (`composeai-data`, the tools repository's separately-versioned
# data line, went with the move.) A point pin, for the same reason as the two above.
#
# 3.4.5 carries the fix for the live lane's `previewOverrideChoice` crash
# (compose-preview-server#839, compose-preview-daemon#99): the JVM `PreviewOverrideOption` is an
# `actual typealias` onto `ee.schimke.composeai.data.overrides.`, a package the daemon's
# `mustDelegateToParent` did not pin to the parent loader, so on the bundle-backed Android lane the
# option resolved child-first out of the bundle jar while the overrides runtime resolved to the
# Robolectric sandbox copy — `ClassCastException: PreviewOverrideOption cannot be cast to
# PreviewOverrideOption`. Any catalog shipping an option-bearing knob hit it; nothing here changes
# but the pin. 3.4.4 rides along (contracts 2.18.0, third-party-rc-embedded-player 1.61.1).
# 3.4.8 makes Glimmer Live start in touch mode, matching snapshots and physical devices, then enter
# keyboard/focus mode only when pointer movement establishes gaze (compose-preview-daemon#111).
#
# 3.6.1 because 3.6.0's GITHUB RELEASE is a permanently empty draft, and this repository needs both
# of a daemon release's channels, not one. Maven Central carries 3.6.0 fine -- the BOM and all
# seventy coordinates resolve -- so Gradle never noticed. The preview-host image is what noticed:
# its Dockerfile fetches `compose-preview-desktop-daemon-<version>.tar.gz` from
# `releases/download/v<version>/`, which 404s for 3.6.0, and `--retry-all-errors` then spends ten
# minutes retrying a 404 that cannot succeed before failing the build. That is what killed this
# repository's v3.36.0 release and left preview.coo.ee unable to roll ANY new image.
#
# 3.6.0 will not heal: it is tagged, so its release cannot be re-cut, and its sidecars were never
# attached (compose-preview-daemon#127 -- a `publish-maven` that uploaded to Central and then failed
# on a protected-branch push, taking the `release` job with it). Moving forward is the only repair.
#
# 3.6.1 is verified on BOTH channels, which is the check this bump exists to make:
#   * GitHub assets -- `compose-preview-desktop-daemon-3.6.1.tar.gz` (72.6 MB) and
#     `compose-preview-android-daemon-3.6.1.zip` (248.9 MB), both present.
#   * Maven Central -- the BOM pins all 70 coordinates at 3.6.1, a full publish with no gaps.
#
# NOT 3.7.0, which is published with its assets but whose Central sync had not landed when this was
# written: every coordinate, the BOM included, still 404s there. Bumping to it would trade a broken
# image build for a broken Gradle resolve. Renovate can take this line to 3.7.0 once Central catches
# up, by which point it is a routine bump rather than the one unblocking a restart loop.
#
# 3.6.1 is also the release that restores the contract's unknown-enum rule. 3.5.0 shipped
# `coerceInputValues` on `DesignPagesJson` (compose-preview-daemon#119), and that flag is Json-wide
# rather than per-field, so it disabled the rule for EVERY enum the contract carries -- blend modes
# included, where reinterpreting an unrecognised value composites a layer the reader believes is
# authored. compose-preview-daemon#128 reverted it. ServeDesignPageStoreTest's "an unknown link
# method" case is the assertion that states the rule, and it tracks this pin: on 3.6.0 it must
# assert the degrade, on 3.6.1 the drop.
#
# 3.8.0 puts the design-pages wire types behind builders: the constructors are `internal` and
# `@ConsistentCopyVisibility` takes the generated `copy` with them, so neither can be the signature
# a released consumer loses when a field is added upstream. That is the same break this pin's own
# history records twice over, from the other side. Construction here moves to
# `Type.Builder(...).build()` and derivation to `newBuilder()`, exactly as contracts 3.0.0 did in
# #910; `ServeDesignPageStoreTest`'s unknown-enum case still asserts the drop.
#
# 3.8.4 classifies a Skiko bindings/native mismatch (`UnsatisfiedLinkError` on a `org.jetbrains.skia.`
# entry point, or a missing libskiko) as `classpathSkew` with a fix hint instead of `runtime`
# (compose-preview-daemon#158), so the native render lane's `renderFailed` reason — surfaced since
# #1069 — names the fix. No API this server calls changed.
# 3.9.0 starts daemon and spare-worker JVMs with an allowlisted environment by default
# (compose-preview-daemon#161); moved with composeai-tools 2.26.1. 3.9.0 republished only
# `daemon-client`, so `server/build.gradle.kts` takes the desktop sidecars through the BOM.
# 3.9.1 runs the `compose/figma-svg` export only when a render requests the kind, records the
# post-capture work each render did (`postCapture.<kind>` / `postCaptureSkipped.<kind>` in the
# `render/trace` metrics), enables `compose/semantics` by default (#1166) and adds
# `DaemonSession.compileSources` (#1174, compose-preview-daemon#163).
# 3.11.0 reports each render's work on `renderFinished.workTrace` — the post-capture processors
# and data kinds it ran, with per-step ms (compose-preview-daemon#189, #1181). It is compiled
# against contracts 3.14.0, which is where that field lives, so `composeai-contracts` below must
# be at least 3.14.0.
# 3.12.0 stops staging Remote Compose and the embedded player in the Android sidecar
# (compose-preview-daemon#191), so a bundle's own player draws its live renders. 3.11.0's copy
# shadowed it with a player predating rc-players#558, which draws no text in a
# `RemoteDensity.Host` capture: every live `remote-m3` render came back without its text.
# 3.13.0 honours `@AnimatedPreview(format = Apng)` on Android (compose-preview-daemon#208), writes
# changed-region APNG frames with per-frame delays (#207), advances animated and interaction captures
# by the exact frame interval (#203, #206) and distributes GIF frame-delay rounding so playback keeps
# the captured timeline (#204). No API this server calls changed.
# 3.13.1 gives the `cmp-android` player the pinned Robolectric clock the AndroidX backends already
# get (compose-preview-daemon#209), so its live renders settle instead of waiting on a frame clock
# that never goes idle. That is a precondition for `--rc-default-player cmp-android`.
# 3.13.2 stops two kinds of wasted Android boots on a box hosting many catalogs: a sandbox worker
# with a non-empty directory on its classpath no longer gets a CDS archive it cannot be launched with
# (compose-preview-daemon#213), and the spare pool no longer evicts a just-warmed signature's spares
# for every new one (compose-preview-daemon#215).
# 3.14.0 adds `composeai.daemon.onDemandWorkerBoot` (compose-preview-daemon#219), which the MCP
# server's `DaemonSupervisor` already sets on every daemon it spawns with replicas (#1342): the
# worker sandboxes boot when two different previews render at once instead of behind slot 0 at
# start. It also moves rc-players to 2.1.2 (compose-preview-daemon#217).
# 3.15.0 replays a Remote Compose document carried on `renderNow`
# (`overrides.remoteCompose.documentBase64`, compose-preview-daemon#231) in place of the preview's
# own content: the AndroidX lanes on a shared `/d/<id>` page. The image's `lib-daemon-android`
# sidecar is read from this pin, so it is what makes the deployed host replay the bytes.
# 3.15.1 is built on contracts 3.24.0 (compose-preview-daemon#234), the line this build pins.
# 3.16.0 plays a carried Remote Compose document in a held live session, so input reaches it: the
# Android players (compose-preview-daemon#254, the player daemon's interactive lane, #1609) and the
# CMP JVM player on daemon-desktop (compose-preview-daemon#255, the desktop player daemon, #1616).
# 3.25.0 moves the in-process compile `PlaygroundBtaCompiler` drives from contracts' frozen
# `daemon-bta` to `daemon-compile` (package `ee.schimke.composeai.daemon.compile`), still reached
# through `daemon-core`'s `api` edge (compose-preview-daemon#388); the `composeai.daemon.bta.*`
# property names are unchanged. 3.22.0 made the desktop `compose/figma-svg` export on demand
# (compose-preview-daemon#360), so the UI builder's SVG export reaches it through a fetch-driven
# re-render, which ran at the preview's defaults until 3.25.1 (compose-preview-daemon#391): below
# it the UI builder's SVG export is the packaged preview's empty document, so 3.22.0-3.25.0 are
# not usable here (ui-builder-gate2's `data-material-icon` check is what catches it). 3.29.0 is the
# first release publishing `ghcr.io/yschimke/compose-preview-render-runtime`, which
# `deploy/image/Dockerfile` builds FROM at exactly this version, so the image cannot go below it.
composeai-preview-daemon = "3.29.0"
